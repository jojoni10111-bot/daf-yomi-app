<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בית המדרש הדיגיטלי 📖</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&family=Heebo:wght@300;400;700;900&display=swap');
        
        :root {
            --primary-purple: #6d28d9;
            --deep-purple: #4c1d95;
            --light-purple: #ede9fe;
        }

        body { 
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #ddd6fe 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 10px; }
        
        .sefaria-text { line-height: 2.1; font-size: 1.25rem; }
        .sefaria-text b { color: var(--deep-purple); font-weight: 800; border-bottom: 1px dashed #ddd6fe; }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-scan-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            justify-content: center;
            background: #262626;
        }
        .page-scan-img {
            max-width: none;
            height: auto;
            cursor: zoom-in;
        }
    </style>

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png" />
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">

    <div id="root" class="max-w-md w-full mx-auto h-screen sm:h-auto"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TRACTATES = [
            { he: 'ברכות', en: 'Berakhot' }, { he: 'שבת', en: 'Shabbat' }, { he: 'עירובין', en: 'Eruvin' },
            { he: 'פסחים', en: 'Pesachim' }, { he: 'שקלים', en: 'Shekalim' }, { he: 'יומא', en: 'Yoma' },
            { he: 'סוכה', en: 'Sukkah' }, { he: 'ביצה', en: 'Beitzah' }, { he: 'ראש השנה', en: 'Rosh Hashanah' },
            { he: 'תענית', en: 'Taanit' }, { he: 'מגילה', en: 'Megillah' }, { he: 'מועד קטן', en: 'Moed Katan' },
            { he: 'חגיגה', en: 'Chagigah' }, { he: 'יבמות', en: 'Yevamot' }, { he: 'כתובות', en: 'Ketubot' },
            { he: 'נדרים', en: 'Nedarim' }, { he: 'נזיר', en: 'Nazir' }, { he: 'סוטה', en: 'Sotah' },
            { he: 'גיטין', en: 'Gittin' }, { he: 'קידושין', en: 'Kiddushin' }, { he: 'בבא קמא', en: 'Bava Kamma' },
            { he: 'בבא מציעא', en: 'Bava Metzia' }, { he: 'בבא בתרא', en: 'Bava Batra' }, { he: 'סנהדרין', en: 'Sanhedrin' },
            { he: 'מכות', en: 'Makkot' }, { he: 'שבועות', en: 'Shevuot' }, { he: 'עבודה זרה', en: 'Avodah Zarah' },
            { he: 'הוריות', en: 'Horayot' }, { he: 'זבחים', en: 'Zevachim' }, { he: 'מנחות', en: 'Menachot' },
            { he: 'חולין', en: 'Chullin' }, { he: 'בכורות', en: 'Bekhorot' }, { he: 'ערכין', en: 'Arakhin' },
            { he: 'תמורה', en: 'Temurah' }, { he: 'כריתות', en: 'Keritot' }, { he: 'מעילה', en: 'Meilah' },
            { he: 'תמיד', en: 'Tamid' }, { he: 'מידות', en: 'Middot' }, { he: 'קינים', en: 'Kinnim' }, { he: 'נידה', en: 'Niddah' }
        ];

        const TANYA_SECTIONS = [
            { he: 'לקוטי אמרים', en: 'Tanya, Likutei Amarim', max: 53 },
            { he: 'שער היחוד והאמונה', en: 'Tanya, Shaar HaYichud VeHaEmunah', max: 12 },
            { he: 'אגרת התשובה', en: 'Tanya, Iggeret HaTeshuvah', max: 12 },
            { he: 'אגרת הקודש', en: 'Tanya, Iggeret HaKodesh', max: 32 },
            { he: 'קונטרס אחרון', en: 'Tanya, Kuntres Acharon', max: 9 }
        ];

        function DafYomiApp() {
            const [masterMode, setMasterMode] = useState('daf_yomi'); 
            const [studyMode, setStudyMode] = useState('daily'); 
            
            const [customTractate, setCustomTractate] = useState(TRACTATES[0].en);
            const [customDaf, setCustomDaf] = useState(2);
            const [customAmud, setCustomAmud] = useState('a');
            const [customTanyaSection, setCustomTanyaSection] = useState(TANYA_SECTIONS[0].en);
            const [customTanyaChapter, setCustomTanyaChapter] = useState(1);

            const [dateOffset, setDateOffset] = useState(0); 
            const [dateInfo, setDateInfo] = useState({ he: '', day: '', greg: '' });
            const [isLoading, setIsLoading] = useState(true);
            
            const [dafInfo, setDafInfo] = useState({ he: '', en: '', ref: '' });
            const [isLearned, setIsLearned] = useState(false);
            const [streak, setStreak] = useState(0);
            
            const [tanyaInfo, setTanyaInfo] = useState({ he: '', ref: '' });
            const [isTanyaLearned, setIsTanyaLearned] = useState(false);
            const [tanyaStreak, setTanyaStreak] = useState(0);
            
            const [showText, setShowText] = useState(false);
            const [activeTab, setActiveTab] = useState('gemara');
            const [textContents, setTextContents] = useState({ gemara: [], explanation: [], rashi: [], tosafot: [], tanya_original: [], scan_url: '' });
            const [isTextLoading, setIsTextLoading] = useState(false);
            const [currentActiveRef, setCurrentActiveRef] = useState('');
            const [showHistoryModal, setShowHistoryModal] = useState(false);

            useEffect(() => {
                fetchDailyData();
            }, [dateOffset]);

            const fetchDailyData = async () => {
                setIsLoading(true);
                try {
                    const targetDate = new Date();
                    targetDate.setDate(targetDate.getDate() + dateOffset);
                    const year = targetDate.getFullYear(), month = targetDate.getMonth() + 1, day = targetDate.getDate();

                    const sefariaRes = await fetch(`https://www.sefaria.org/api/calendars?year=${year}&month=${month}&day=${day}`);
                    const sefariaData = await sefariaRes.json();
                    
                    const dafItem = sefariaData.calendar_items.find(item => item.title.en === "Daf Yomi");
                    if (dafItem) setDafInfo({ he: dafItem.displayValue.he, en: dafItem.title.en, ref: dafItem.url });

                    const tanyaItem = sefariaData.calendar_items.find(item => item.title.en === "Tanya Yomi");
                    if (tanyaItem) setTanyaInfo({ he: `תניא - ${tanyaItem.displayValue.he}`, ref: tanyaItem.url });

                    const dateString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const hebcalRes = await fetch(`https://www.hebcal.com/converter?cfg=json&date=${dateString}&g2h=1&strict=1`);
                    const hebcalData = await hebcalRes.json();
                    
                    const formattedGregDate = targetDate.toLocaleDateString('he-IL');
                    setDateInfo({ 
                        he: hebcalData.hebrew.replace(/[\u0591-\u05C7]/g, ""), 
                        day: `יום ${['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'][targetDate.getDay()]}`, 
                        greg: formattedGregDate 
                    });

                    setIsLearned(localStorage.getItem(`daf_learned_${formattedGregDate}`) === 'true');
                    setIsTanyaLearned(localStorage.getItem(`tanya_learned_${formattedGregDate}`) === 'true');
                    setStreak(parseInt(localStorage.getItem('daf_streak') || '0'));
                    setTanyaStreak(parseInt(localStorage.getItem('tanya_streak') || '0'));

                    setIsLoading(false);
                } catch (e) { console.error(e); setIsLoading(false); }
            };

            const fetchTextData = async (tabName, ref) => {
                // המערכת לא תנסה למשוך ביאור תניא כדי לא ליצור שגיאה
                if (tabName === 'tanya_explanation') return; 

                if (textContents[tabName]?.length > 0 && currentActiveRef === ref) return;
                setIsTextLoading(true);
                try {
                    const safeRef = ref.replace(/ /g, '_');
                    let url = '';
                    
                    if (tabName === 'scan') {
                        const parts = safeRef.split('.');
                        const scanUrl = `https://images.sefaria.org/Talmud/Bavli/Vilna/${parts[0]}/${parts[1]}.jpg`;
                        setTextContents(prev => ({ ...prev, scan_url: scanUrl }));
                    } else {
                        switch (tabName) {
                            case 'gemara': url = `https://www.sefaria.org/api/texts/${safeRef}`; break;
                            case 'explanation': url = `https://www.sefaria.org/api/texts/Steinsaltz_on_${safeRef}`; break;
                            case 'rashi': url = `https://www.sefaria.org/api/texts/Rashi_on_${safeRef}`; break;
                            case 'tosafot': url = `https://www.sefaria.org/api/texts/Tosafot_on_${safeRef}`; break;
                            case 'tanya_original': url = `https://www.sefaria.org/api/texts/${safeRef}`; break;
                        }
                        const res = await fetch(url);
                        const data = await res.json();
                        setTextContents(prev => ({ ...prev, [tabName]: (Array.isArray(data.he) ? data.he.flat() : [data.he]).filter(Boolean) }));
                    }
                } catch (e) { console.error(e); }
                setIsTextLoading(false);
            };

            const handleEnterBeitMidrash = () => {
                const ref = masterMode === 'daf_yomi' 
                    ? (studyMode === 'daily' ? dafInfo.ref : `${customTractate}.${customDaf}${customAmud}`)
                    : (studyMode === 'daily' ? tanyaInfo.ref : `${customTanyaSection}.${customTanyaChapter}`);
                setCurrentActiveRef(ref);
                setShowText(true);
                const initialTab = masterMode === 'daf_yomi' ? 'gemara' : 'tanya_original';
                setActiveTab(initialTab);
                fetchTextData(initialTab, ref);
            };

            const handleToggleLearn = () => {
                const key = masterMode === 'daf_yomi' ? `daf_learned_${dateInfo.greg}` : `tanya_learned_${dateInfo.greg}`;
                const streakKey = masterMode === 'daf_yomi' ? 'daf_streak' : 'tanya_streak';
                const isCurrent = masterMode === 'daf_yomi' ? isLearned : isTanyaLearned;
                
                const newVal = !isCurrent;
                if (masterMode === 'daf_yomi') setIsLearned(newVal); else setIsTanyaLearned(newVal);
                
                localStorage.setItem(key, newVal.toString());
                const newStreak = newVal ? (parseInt(localStorage.getItem(streakKey) || '0') + 1) : Math.max(0, parseInt(localStorage.getItem(streakKey) || '0') - 1);
                localStorage.setItem(streakKey, newStreak.toString());
                if (masterMode === 'daf_yomi') setStreak(newStreak); else setTanyaStreak(newStreak);

                const histKey = masterMode === 'daf_yomi' ? 'daf_history' : 'tanya_history';
                let hist = JSON.parse(localStorage.getItem(histKey) || '[]');
                if (newVal) hist.unshift({ gregDate: dateInfo.greg, heDate: dateInfo.he, dafName: masterMode === 'daf_yomi' ? dafInfo.he : tanyaInfo.he });
                else hist = hist.filter(h => h.gregDate !== dateInfo.greg);
                localStorage.setItem(histKey, JSON.stringify(hist));
            };

            return (
                <div className="bg-white/40 shadow-2xl overflow-hidden sm:rounded-[2.5rem] flex flex-col h-full sm:h-[88vh] relative w-full glass-card border-none">
                    
                    {/* Header */}
                    <div className="bg-gradient-to-br from-violet-600 to-indigo-800 p-6 pt-12 pb-10 text-white text-center relative shrink-0 rounded-b-[3rem] shadow-2xl">
                        <div className="absolute top-6 left-6 bg-white/10 backdrop-blur-md rounded-2xl px-4 py-2 flex items-center gap-2 shadow-lg border border-white/20">
                            <span className="text-2xl animate-pulse">🔥</span>
                            <span className="font-black text-xl tracking-tighter">{masterMode === 'daf_yomi' ? streak : tanyaStreak}</span>
                        </div>
                        
                        <button onClick={() => setShowHistoryModal(true)} className="absolute top-6 right-6 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-2xl p-2.5 transition-all shadow-lg border border-white/20">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        </button>

                        <h1 className="text-3xl font-black mb-6 tracking-tight drop-shadow-md">בית המדרש 🏛️</h1>

                        <div className="flex justify-center gap-3 mb-6 p-1 bg-black/10 rounded-[1.5rem] backdrop-blur-sm max-w-[280px] mx-auto border border-white/10">
                            <button onClick={() => {setMasterMode('daf_yomi'); setShowText(false);}} className={`flex-1 py-3 rounded-[1.2rem] text-sm font-bold transition-all ${masterMode === 'daf_yomi' ? 'bg-white text-violet-700 shadow-xl scale-105' : 'text-violet-100 hover:text-white'}`}>גמרא</button>
                            <button onClick={() => {setMasterMode('tanya'); setShowText(false);}} className={`flex-1 py-3 rounded-[1.2rem] text-sm font-bold transition-all ${masterMode === 'tanya' ? 'bg-white text-violet-700 shadow-xl scale-105' : 'text-violet-100 hover:text-white'}`}>תניא</button>
                        </div>

                        <div className="flex bg-white/10 p-1 rounded-xl max-w-[160px] mx-auto">
                            <button onClick={() => setStudyMode('daily')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${studyMode === 'daily' ? 'bg-white/20 text-white' : 'text-violet-200 hover:text-white'}`}>יומי</button>
                            <button onClick={() => setStudyMode('custom')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${studyMode === 'custom' ? 'bg-white/20 text-white' : 'text-violet-200 hover:text-white'}`}>אישי</button>
                        </div>
                    </div>

                    {/* Main Screen */}
                    <div className="p-8 text-center overflow-y-auto grow custom-scrollbar flex flex-col justify-center animate-fade-in">
                        
                        {studyMode === 'daily' || masterMode === 'tanya' ? (
                            <div className="space-y-8">
                                <div className="flex flex-col items-center">
                                    <div className="flex items-center justify-between w-full bg-violet-50/50 rounded-3xl p-4 border border-violet-100/50 shadow-sm">
                                        <button onClick={() => setDateOffset(prev => prev - 1)} className="p-3 bg-white text-violet-600 rounded-2xl shadow-sm hover:scale-110 transition-transform"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"></path></svg></button>
                                        <div className="text-center">
                                            <span className="block text-xl font-black text-violet-900">{dateInfo.day}</span>
                                            <span className="block text-sm font-bold text-violet-500">{dateInfo.he}</span>
                                        </div>
                                        <button onClick={() => setDateOffset(prev => prev + 1)} className="p-3 bg-white text-violet-600 rounded-2xl shadow-sm hover:scale-110 transition-transform"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"></path></svg></button>
                                    </div>
                                    {dateOffset !== 0 && <button onClick={() => setDateOffset(0)} className="mt-4 text-xs font-black text-violet-600 hover:underline">חזור להיום</button>}
                                </div>

                                <h2 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-700 to-indigo-900 leading-tight">
                                    {masterMode === 'daf_yomi' ? dafInfo.he : tanyaInfo.he}
                                </h2>

                                <button onClick={handleToggleLearn} className={`w-full py-5 rounded-3xl text-2xl font-black transition-all shadow-xl flex items-center justify-center gap-4 transform active:scale-95 ${
                                    (masterMode === 'daf_yomi' ? isLearned : isTanyaLearned) ? 'bg-green-500 text-white' : 'bg-white text-violet-700 border-2 border-violet-100 hover:bg-violet-50'
                                }`}>
                                    {(masterMode === 'daf_yomi' ? isLearned : isTanyaLearned) ? 'למדתי היום! ✨' : 'סמן כנלמד'}
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-6 bg-violet-50/50 p-6 rounded-[2rem] border border-violet-100">
                                <h3 className="text-lg font-bold text-violet-800">בחר מסכת ודף</h3>
                                <select value={customTractate} onChange={e => setCustomTractate(e.target.value)} className="w-full bg-white border-2 border-violet-200 rounded-2xl px-4 py-4 text-lg font-bold text-violet-700 focus:ring-4 focus:ring-violet-200 outline-none">
                                    {TRACTATES.map(t => <option key={t.en} value={t.en}>{t.he}</option>)}
                                </select>
                                <div className="flex gap-4">
                                    <input type="number" value={customDaf} onChange={e => setCustomDaf(e.target.value)} className="flex-1 bg-white border-2 border-violet-200 rounded-2xl p-4 text-center text-xl font-black text-violet-700" />
                                    <select value={customAmud} onChange={e => setCustomAmud(e.target.value)} className="flex-1 bg-white border-2 border-violet-200 rounded-2xl p-4 text-center font-bold text-violet-700">
                                        <option value="a">עמוד א'</option><option value="b">עמוד ב'</option>
                                    </select>
                                </div>
                            </div>
                        )}

                        <button onClick={handleEnterBeitMidrash} className="mt-10 bg-gradient-to-br from-violet-600 to-indigo-700 text-white w-full py-5 rounded-[2rem] text-xl font-black shadow-2xl hover:shadow-violet-300 transition-all flex justify-center items-center gap-3 group">
                            היכנס לבית המדרש 📖
                            <svg className="w-6 h-6 group-hover:translate-x-[-5px] transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M11 19l-7-7 7-7"></path></svg>
                        </button>
                    </div>

                    {/* בית המדרש המורחב */}
                    {showText && (
                        <div className="fixed inset-0 bg-white z-[100] flex flex-col animate-fade-in">
                            <div className="bg-violet-900 p-4 pt-10 text-white flex items-center justify-between shrink-0 shadow-2xl">
                                <h2 className="text-xl font-black flex items-center gap-3">
                                    <span className="p-2 bg-white/10 rounded-xl">📚</span>
                                    {masterMode === 'daf_yomi' ? (studyMode === 'daily' ? dafInfo.he : `${TRACTATES.find(t => t.en === customTractate).he} ${customDaf}`) : tanyaInfo.he}
                                </h2>
                                <button onClick={() => setShowText(false)} className="bg-white/10 hover:bg-white/20 text-white rounded-2xl py-2 px-5 font-black text-sm border border-white/20 transition-all active:scale-90">סגור</button>
                            </div>

                            <div className="flex bg-violet-50 shrink-0 overflow-x-auto custom-scrollbar border-b border-violet-100">
                                {[
                                    ...(masterMode === 'daf_yomi' ? [{id: 'scan', label: 'צורת הדף' }, {id: 'gemara', label: 'גמרא' }, {id: 'explanation', label: 'ביאור' }, {id: 'rashi', label: 'רש"י' }, {id: 'tosafot', label: 'תוספות' }] : [{id: 'tanya_original', label: 'תניא' }, {id: 'tanya_explanation', label: 'ביאור' }])
                                ].map(tab => (
                                    <button key={tab.id} onClick={() => { setActiveTab(tab.id); fetchTextData(tab.id, currentActiveRef); }} className={`flex-1 min-w-[100px] py-4 text-sm font-black transition-all ${activeTab === tab.id ? 'bg-white text-violet-700 border-b-4 border-violet-600' : 'text-violet-400 hover:text-violet-600'}`}>
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <div className="flex-1 overflow-hidden bg-white">
                                {isTextLoading ? (
                                    <div className="flex flex-col justify-center items-center h-full gap-5">
                                        <div className="w-16 h-16 border-4 border-violet-200 border-b-violet-600 rounded-full animate-spin"></div>
                                        <p className="font-black text-violet-400">מושך את התוכן...</p>
                                    </div>
                                ) : (
                                    activeTab === 'scan' ? (
                                        <div className="page-scan-container custom-scrollbar">
                                            <img 
                                                src={textContents.scan_url} 
                                                className="page-scan-img" 
                                                alt="צורת הדף"
                                                onDoubleClick={(e) => {
                                                    const img = e.target;
                                                    img.style.width = img.style.width === '200%' ? '100%' : '200%';
                                                }}
                                            />
                                        </div>
                                    ) : activeTab === 'tanya_explanation' ? (
                                        // מסך מיוחד ומעוצב לביאור התניא המפנה לאתר חב"ד
                                        <div className="flex flex-col justify-center items-center h-full gap-6 text-center p-8 bg-violet-50/50">
                                            <span className="text-7xl mb-2 drop-shadow-md">💡</span>
                                            <h3 className="text-3xl font-black text-violet-900 mb-2">ביאור התניא</h3>
                                            <p className="text-xl text-violet-700 font-medium max-w-md leading-relaxed">
                                                בשל זכויות יוצרים, ביאור הרב שטיינזלץ לספר התניא טרם שוחרר למאגר הפתוח של ספריא.
                                                <br/><br/>
                                                עם זאת, תוכלו ליהנות מהביאור המלא (לצד שיעורי שמע ווידאו מרתקים) באתר הרשמי של חב"ד!
                                            </p>
                                            <a 
                                                href="https://he.chabad.org/dailystudy/tanya.htm" 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="mt-6 bg-gradient-to-br from-violet-600 to-indigo-700 text-white px-8 py-5 rounded-[2rem] font-black text-xl shadow-xl hover:shadow-violet-400 hover:scale-105 transition-all"
                                            >
                                                לפתיחת הביאור באתר חב"ד 📚
                                            </a>
                                        </div>
                                    ) : (
                                        <div className="p-8 text-right overflow-y-auto h-full custom-scrollbar leading-relaxed">
                                            <div className="max-w-3xl mx-auto sefaria-text" dir="rtl">
                                                {textContents[activeTab]?.map((p, i) => (
                                                    <p key={i} className="mb-8 p-6 bg-white rounded-3xl border border-violet-50 shadow-sm" dangerouslySetInnerHTML={{ __html: p }} />
                                                ))}
                                            </div>
                                        </div>
                                    )
                                )}
                            </div>
                        </div>
                    )}

                    {/* History Modal */}
                    {showHistoryModal && (
                        <div className="absolute inset-0 bg-white z-[101] flex flex-col animate-fade-in">
                            <div className="bg-violet-700 p-6 pt-10 text-white flex items-center justify-between shadow-xl">
                                <h2 className="text-2xl font-black italic underline decoration-violet-300">ההיסטוריה שלי 📔</h2>
                                <button onClick={() => setShowHistoryModal(false)} className="bg-white/10 p-2 rounded-xl"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                            </div>
                            <div className="p-6 overflow-y-auto grow custom-scrollbar bg-violet-50/30">
                                {JSON.parse(localStorage.getItem(masterMode === 'daf_yomi' ? 'daf_history' : 'tanya_history') || '[]').map((h, i) => (
                                    <div key={i} className="bg-white p-5 rounded-3xl border border-violet-100 shadow-sm mb-4 flex justify-between items-center">
                                        <div className="text-right">
                                            <span className="block font-black text-violet-800 text-lg">{h.dafName}</span>
                                            <span className="text-sm font-bold text-violet-400">{h.heDate}</span>
                                        </div>
                                        <span className="text-2xl">✅</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DafYomiApp />);
    </script>
</body>
</html>
