<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>בית המדרש הדיגיטלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Noto+Serif+Hebrew:wght@300;400;600;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a0a2e;
  --ink2:#3d2b5e;
  --ink3:#6b4f8c;
  --gold:#c9a227;
  --gold2:#e8c84a;
  --gold3:#f5e89a;
  --parchment:#faf6ee;
  --parchment2:#f0e8d4;
  --parchment3:#e4d5b8;
  --cream:#fff9f0;
  --red:#8b1a1a;
  --green:#1a5c3a;
  --blue:#1a3a7c;
  --radius:16px;
  --shadow:0 4px 32px rgba(26,10,46,0.18);
}
body{
  font-family:'Frank Ruhl Libre',serif;
  background:var(--parchment);
  min-height:100vh;
  direction:rtl;
  color:var(--ink);
  overflow-x:hidden;
}

/* BG texture */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(201,162,39,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(139,26,26,0.08) 0%, transparent 50%),
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(26,10,46,0.04) 39px,rgba(26,10,46,0.04) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(26,10,46,0.03) 79px,rgba(26,10,46,0.03) 80px);
  pointer-events:none;
}

#app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
.header{
  background:linear-gradient(160deg, var(--ink) 0%, var(--ink2) 100%);
  padding:20px 20px 0;
  border-bottom:3px solid var(--gold);
  position:relative;overflow:hidden;
}
.header::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(201,162,39,0.04) 20px,rgba(201,162,39,0.04) 21px);
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative;z-index:1;}
.logo{
  font-family:'Noto Serif Hebrew',serif;
  font-size:22px;font-weight:900;
  color:var(--gold2);
  letter-spacing:0.02em;
  text-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.logo span{color:white;font-weight:300;}
.streak-badge{
  background:rgba(201,162,39,0.2);
  border:1px solid rgba(201,162,39,0.4);
  border-radius:20px;padding:6px 14px;
  display:flex;align-items:center;gap:6px;
  color:var(--gold2);font-size:18px;font-weight:700;
}
.streak-badge svg{width:18px;height:18px;fill:var(--gold2);}

/* MODE TABS */
.mode-tabs{
  display:flex;gap:4px;background:rgba(255,255,255,0.07);
  border-radius:14px;padding:4px;margin-bottom:0;position:relative;z-index:1;
}
.mode-tab{
  flex:1;padding:10px 8px;border:none;cursor:pointer;
  border-radius:10px;font-family:'Frank Ruhl Libre',serif;
  font-size:15px;font-weight:600;transition:all 0.2s;
  color:rgba(255,255,255,0.5);background:transparent;
}
.mode-tab.active{
  background:var(--gold);color:var(--ink);
  font-weight:700;box-shadow:0 2px 12px rgba(201,162,39,0.4);
}

/* CALENDAR STRIP */
.cal-strip{
  padding:0 20px;margin-top:0;
  background:linear-gradient(180deg, var(--ink2) 0%, var(--ink) 100%);
  padding-bottom:4px;
}

/* HEBREW CALENDAR */
.heb-cal{
  background:var(--parchment);
  border:2px solid var(--gold);
  border-top:none;
  border-radius:0 0 20px 20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.heb-cal-header{
  background:var(--parchment2);
  border-bottom:1.5px solid var(--parchment3);
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.heb-cal-header .month-nav{
  background:none;border:none;cursor:pointer;
  color:var(--ink2);font-size:20px;padding:2px 8px;
  border-radius:6px;transition:background 0.15s;
  font-family:'Frank Ruhl Libre',serif;
}
.heb-cal-header .month-nav:hover{background:var(--parchment3);}
.heb-month-title{
  font-family:'Noto Serif Hebrew',serif;
  font-size:16px;font-weight:700;color:var(--ink);
  text-align:center;
}
.heb-month-title .greg-sub{
  display:block;font-size:11px;color:var(--ink3);font-weight:400;margin-top:1px;
}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--parchment2);
  border-bottom:1px solid var(--parchment3);
}
.cal-wd{
  text-align:center;padding:6px 2px;
  font-size:11px;font-weight:600;color:var(--ink3);
  font-family:'Noto Serif Hebrew',serif;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:4px;}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-radius:10px;cursor:pointer;
  transition:all 0.15s;position:relative;
  padding:2px 0;
}
.cal-cell:hover:not(.empty){background:var(--parchment2);}
.cal-cell.empty{cursor:default;}
.cal-cell.today{background:var(--ink);color:white;}
.cal-cell.today .hday{color:rgba(255,255,255,0.7);}
.cal-cell.today .gday{color:white;}
.cal-cell.learned{background:var(--green);color:white;}
.cal-cell.learned .hday{color:rgba(255,255,255,0.8);}
.cal-cell.learned .gday{color:white;}
.cal-cell.learned::after{
  content:'✓';
  position:absolute;top:2px;left:3px;
  font-size:9px;color:rgba(255,255,255,0.9);font-weight:700;
}
.cal-cell.shabbat:not(.today):not(.learned) .gday{color:var(--red);}
.cal-cell.shabbat:not(.today):not(.learned) .hday{color:var(--red);}
.cal-cell.selected:not(.today):not(.learned){
  background:rgba(201,162,39,0.25);
  border:1.5px solid var(--gold);
}
.hday{font-size:11px;color:var(--ink3);line-height:1;font-family:'Noto Serif Hebrew',serif;font-weight:500;}
.gday{font-size:14px;font-weight:600;color:var(--ink);line-height:1.2;}

/* MAIN CONTENT */
.main{flex:1;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px;}

/* STUDY CARD */
.study-card{
  background:white;
  border-radius:20px;
  border:1.5px solid var(--parchment3);
  box-shadow:0 2px 16px rgba(26,10,46,0.08);
  overflow:hidden;
}
.study-card-header{
  background:linear-gradient(135deg, var(--parchment2) 0%, var(--parchment) 100%);
  border-bottom:1px solid var(--parchment3);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.study-card-label{
  font-size:11px;font-weight:700;letter-spacing:0.08em;
  color:var(--ink3);text-transform:uppercase;
}
.study-type-badge{
  font-size:11px;padding:3px 10px;border-radius:20px;
  font-weight:700;
}
.badge-gemara{background:rgba(26,58,124,0.12);color:var(--blue);}
.badge-tanya{background:rgba(26,92,58,0.12);color:var(--green);}
.badge-daily{background:rgba(201,162,39,0.15);color:#7a5c00;}
.badge-custom{background:rgba(107,79,140,0.12);color:var(--ink2);}

.study-card-body{padding:16px;}
.daf-title{
  font-family:'Noto Serif Hebrew',serif;
  font-size:28px;font-weight:900;
  color:var(--ink);line-height:1.2;margin-bottom:4px;
}
.daf-subtitle{font-size:13px;color:var(--ink3);font-weight:400;}

/* LEARN BUTTON */
.learn-btn{
  width:100%;padding:14px;border:none;cursor:pointer;
  border-radius:14px;font-family:'Frank Ruhl Libre',serif;
  font-size:17px;font-weight:700;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:12px;
}
.learn-btn.idle{
  background:var(--ink);color:var(--gold2);
  border:1.5px solid var(--ink);
}
.learn-btn.idle:hover{background:var(--ink2);}
.learn-btn.done{
  background:var(--green);color:white;
}
.learn-btn svg{width:20px;height:20px;}

/* ENTER BTN */
.enter-btn{
  width:100%;padding:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  color:var(--ink);
  border-radius:16px;font-family:'Noto Serif Hebrew',serif;
  font-size:19px;font-weight:900;
  box-shadow:0 4px 20px rgba(201,162,39,0.35);
  transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:0.02em;
}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(201,162,39,0.45);}
.enter-btn:active{transform:scale(0.98);}
.enter-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

/* CUSTOM PICKER */
.picker-row{display:flex;gap:8px;align-items:center;}
.picker-btn{
  background:white;border:1.5px solid var(--parchment3);
  border-radius:10px;padding:8px 12px;cursor:pointer;
  color:var(--ink2);font-size:16px;font-weight:700;
  transition:all 0.15s;font-family:'Frank Ruhl Libre',serif;
}
.picker-btn:hover{background:var(--parchment2);}
.picker-select{
  flex:1;background:white;border:1.5px solid var(--parchment3);
  border-radius:10px;padding:10px 12px;
  font-family:'Frank Ruhl Libre',serif;font-size:14px;font-weight:600;
  color:var(--ink);direction:rtl;outline:none;cursor:pointer;
  appearance:none;text-align:center;
}
.picker-select:focus{border-color:var(--gold);}

/* STUDY VIEW OVERLAY */
.overlay{
  position:fixed;inset:0;z-index:200;
  background:var(--parchment);
  display:flex;flex-direction:column;
  animation:slideUp 0.3s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.overlay-header{
  background:var(--ink);
  padding:16px 16px 0;
  border-bottom:2px solid var(--gold);
}
.overlay-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.overlay-title{
  font-family:'Noto Serif Hebrew',serif;
  font-size:18px;font-weight:900;color:var(--gold2);
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;
}
.overlay-title span{truncate:ellipsis;overflow:hidden;white-space:nowrap;}
.overlay-close{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
  color:white;border-radius:10px;padding:6px 14px;cursor:pointer;
  font-family:'Frank Ruhl Libre',serif;font-size:14px;font-weight:600;
  transition:background 0.15s;flex-shrink:0;
}
.overlay-close:hover{background:rgba(255,255,255,0.2);}
.daf-nav{
  display:flex;gap:8px;padding:10px 16px;
  background:var(--ink2);
  border-bottom:1px solid rgba(201,162,39,0.3);
}
.daf-nav-btn{
  flex:1;padding:10px;border:1px solid rgba(201,162,39,0.3);
  border-radius:10px;background:rgba(255,255,255,0.07);
  color:var(--gold2);font-family:'Frank Ruhl Libre',serif;
  font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;
}
.daf-nav-btn:hover{background:rgba(255,255,255,0.15);}
.tabs{display:flex;background:white;border-bottom:2px solid var(--parchment3);}
.tab{
  flex:1;padding:12px 4px;border:none;background:none;cursor:pointer;
  font-family:'Frank Ruhl Libre',serif;font-size:13px;font-weight:600;
  color:#888;transition:all 0.15s;border-bottom:3px solid transparent;margin-bottom:-2px;
}
.tab.active{color:var(--ink);border-bottom-color:var(--gold);}
.tab-content{flex:1;overflow-y:auto;padding:20px 16px;}

/* TEXT DISPLAY */
.gemara-text{
  font-family:'Noto Serif Hebrew',serif;
  font-size:19px;line-height:2.1;color:var(--ink);
  direction:rtl;
}
.gemara-text p{
  margin-bottom:24px;padding:16px 20px;
  background:white;border-radius:14px;
  border:1px solid var(--parchment3);
  border-right:4px solid var(--gold);
}
.gemara-text b{color:var(--ink);font-weight:700;}

/* PORTAL CARD */
.portal-card{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 24px;gap:20px;text-align:center;
  flex:1;
}
.portal-icon{font-size:48px;margin-bottom:4px;}
.portal-title{
  font-family:'Noto Serif Hebrew',serif;
  font-size:24px;font-weight:900;color:var(--ink);
}
.portal-desc{font-size:14px;color:var(--ink3);line-height:1.7;max-width:280px;}
.portal-btn{
  display:block;width:100%;padding:14px;text-decoration:none;
  background:var(--ink);color:var(--gold2);
  border-radius:14px;font-family:'Noto Serif Hebrew',serif;
  font-size:17px;font-weight:900;text-align:center;
  box-shadow:0 4px 16px rgba(26,10,46,0.2);transition:all 0.2s;cursor:pointer;border:none;
}
.portal-btn:hover{background:var(--ink2);}

/* NOTES */
.notes-area{
  padding:12px 16px;background:#fffbf0;
  border-top:1px solid #e8d89a;
  flex-shrink:0;
}
.notes-label{font-size:12px;font-weight:700;color:#7a5c00;margin-bottom:6px;text-align:right;}
.notes-ta{
  width:100%;min-height:100px;resize:none;
  background:white;border:1.5px solid #e8d89a;
  border-radius:10px;padding:10px 14px;
  font-family:'Frank Ruhl Libre',serif;font-size:15px;
  color:var(--ink);direction:rtl;outline:none;
  line-height:1.7;
}
.notes-ta:focus{border-color:var(--gold);}

/* LOADER */
.loader{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:40px;color:var(--ink2);
}
.spin{
  width:36px;height:36px;
  border:3px solid var(--parchment3);
  border-top-color:var(--gold);
  border-radius:50%;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* DATE NAV */
.date-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;
}
.date-nav-btn{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
  border-radius:8px;padding:5px 12px;cursor:pointer;
  color:rgba(255,255,255,0.7);font-size:16px;transition:all 0.15s;
}
.date-nav-btn:hover{background:rgba(255,255,255,0.2);}
.date-display{text-align:center;color:white;}
.date-display .hdate{font-family:'Noto Serif Hebrew',serif;font-size:14px;font-weight:700;}
.date-display .gdate{font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;}

/* SPINNER overlay */
.full-loader{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;flex:1;
}
.full-loader p{font-family:'Noto Serif Hebrew',serif;font-size:18px;color:var(--ink2);font-weight:700;}

/* ERROR */
.error-box{
  background:#fff8e6;border:1.5px solid #e8d89a;
  border-radius:14px;padding:12px 16px;
  font-size:13px;color:#7a5c00;font-weight:600;line-height:1.6;
}

/* HISTORY MODAL */
.hist-modal{position:fixed;inset:0;z-index:300;background:var(--parchment);display:flex;flex-direction:column;animation:slideUp 0.25s ease-out;}
.hist-header{
  background:var(--ink);padding:20px;border-bottom:2px solid var(--gold);
  display:flex;align-items:center;justify-content:space-between;
}
.hist-title{font-family:'Noto Serif Hebrew',serif;font-size:20px;font-weight:900;color:var(--gold2);}
.hist-close{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;border-radius:10px;padding:6px 14px;cursor:pointer;font-size:14px;font-weight:600;}
.hist-content{flex:1;overflow-y:auto;padding:20px;}

/* CUSTOM SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--parchment3);border-radius:10px}

/* Toggle row */
.study-mode-row{
  display:flex;gap:4px;background:var(--parchment2);
  border-radius:10px;padding:3px;border:1px solid var(--parchment3);
}
.study-mode-btn{
  flex:1;padding:7px;border:none;cursor:pointer;
  border-radius:8px;font-family:'Frank Ruhl Libre',serif;
  font-size:13px;font-weight:600;transition:all 0.15s;
  background:transparent;color:var(--ink3);
}
.study-mode-btn.active{background:white;color:var(--ink);box-shadow:0 1px 6px rgba(26,10,46,0.1);}

.hidden{display:none!important;}
.fade{animation:fadeIn 0.25s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="logo">בית המדרש <span>הדיגיטלי</span></div>
      <div id="streakBadge" class="streak-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14zm0 17a3 3 0 0 1-3-3c0-3 3-4 3-7 0 3 3 4 3 7a3 3 0 0 1-3 3z"/></svg>
        <span id="streakNum">0</span>
      </div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tabGemara" onclick="setMaster('gemara')">גמרא</button>
      <button class="mode-tab" id="tabTanya" onclick="setMaster('tanya')">תניא</button>
      <button class="mode-tab" id="tabHistory" onclick="showHistory()">📋 היסטוריה</button>
    </div>
    <div class="cal-strip">
      <div class="date-nav">
        <button class="date-nav-btn" onclick="shiftDate(1)">‹</button>
        <div class="date-display">
          <div class="hdate" id="hebDateDisplay">טוען...</div>
          <div class="gdate" id="gregDateDisplay"></div>
        </div>
        <button class="date-nav-btn" onclick="shiftDate(-1)">›</button>
      </div>
    </div>
  </div>

  <div id="calContainer" class="heb-cal">
    <div class="heb-cal-header">
      <button class="month-nav" onclick="prevCalMonth()">›</button>
      <div class="heb-month-title">
        <span id="calMonthTitle">טוען...</span>
        <span class="greg-sub" id="calGregSub"></span>
      </div>
      <button class="month-nav" onclick="nextCalMonth()">‹</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-wd">א</div><div class="cal-wd">ב</div><div class="cal-wd">ג</div>
      <div class="cal-wd">ד</div><div class="cal-wd">ה</div><div class="cal-wd">ו</div>
      <div class="cal-wd">ש</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="main" id="mainContent">
    <div class="full-loader" id="mainLoader">
      <div class="spin"></div>
      <p>טוען לימוד יומי...</p>
    </div>
    <div id="mainBody" class="hidden fade">
      <div id="errorBox" class="error-box hidden"></div>
      <div class="study-card">
        <div class="study-card-header">
          <div class="study-card-label" id="studyCardLabel">דף יומי</div>
          <div style="display:flex;gap:6px;">
            <span id="masterBadge" class="study-type-badge badge-gemara">גמרא</span>
            <span id="modeBadge" class="study-type-badge badge-daily">יומי</span>
          </div>
        </div>
        <div class="study-card-body">
          <div class="study-mode-row" style="margin-bottom:14px;">
            <button class="study-mode-btn active" id="btnDaily" onclick="setMode('daily')">לימוד יומי</button>
            <button class="study-mode-btn" id="btnCustom" onclick="setMode('custom')">בחירה חופשית</button>
          </div>

          <!-- DAILY VIEW -->
          <div id="dailyView">
            <div class="daf-title" id="dailyTitle">-</div>
            <div class="daf-subtitle" id="dailySubtitle"></div>
            <button class="learn-btn idle" id="learnBtn" onclick="toggleLearn()">
              <span id="learnBtnText">סמן כנלמד</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
            </button>
          </div>

          <!-- CUSTOM VIEW -->
          <div id="customView" class="hidden">
            <div id="gemaraCustomPicker">
              <div style="margin-bottom:10px;">
                <select class="picker-select" id="customTractate" style="width:100%;margin-bottom:8px;"></select>
              </div>
              <div class="picker-row">
                <button class="picker-btn" onclick="moveDaf(-1)">‹</button>
                <select class="picker-select" id="customDaf"></select>
                <select class="picker-select" id="customAmud" style="max-width:90px;">
                  <option value="a">עמוד א'</option>
                  <option value="b">עמוד ב'</option>
                </select>

// Correct cumulative daf-yomi page IDs
// Each tractate starts at 2a. 2a=id_start, 2b=id_start+1, 3a=id_start+2...
// Berakhot 2a = id 1
const TRACTATE_ID_STARTS = (()=>{
  let starts={};
  let current=1;
  for(const t of TRACTATES){
    starts[t.en]=current;
    // pages: 2a,2b,3a,...,maxDaf*b = (maxDaf-1)*2 pages total
    current += (t.daf-1)*2;
  }
  return starts;
})();

function getDafYomiId(tractateEn, daf, amud){
  const start = TRACTATE_ID_STARTS[tractateEn];
  if(!start || daf<2) return null;
  // daf 2a = start+0, daf 2b = start+1, daf 3a = start+2 ...
  return start + (daf-2)*2 + (amud==='b'?1:0);
}

function getDafYomiUrl(tractateEn, daf, amud){
  const id = getDafYomiId(tractateEn, daf, amud);
  if(!id) return 'https://daf-yomi.com/';
  return `https://daf-yomi.com/DafYomi_Page.aspx?vt=1&id=${id}`;
}

function parseDafRef(ref){
  if(!ref) return null;
  const s = String(ref).replace(/_/g,' ').trim();
  const m = s.match(/^(.+?)\.(\d+)(a|b)$/i);
  if(m) return {tractateEn:m[1].replace(/ /g,'_'), daf:parseInt(m[2]), amud:m[3].toLowerCase()};
  // fallback: "Tractate Name 26a"
  const m2 = s.match(/^(.+?)\s+(\d+)(a|b)$/i);
  if(m2) return {tractateEn:m2[1].replace(/ /g,'_'), daf:parseInt(m2[2]), amud:m2[3].toLowerCase()};
  return null;
}

function buildRef(tractateEn, daf, amud){ return `${tractateEn}.${daf}${amud}`; }

function getAdjacentRef(ref, dir){
  const p = parseDafRef(ref);
  if(!p) return ref;
  const idx = TRACTATES.findIndex(t=>t.en===p.tractateEn);
  if(idx<0) return ref;
  let {tractateEn,daf,amud}=p;
  const maxDaf = TRACTATES[idx].daf;
  if(dir>0){
    if(amud==='a') amud='b';
    else if(daf<maxDaf){daf++;amud='a';}
    else if(TRACTATES[idx+1]){tractateEn=TRACTATES[idx+1].en;daf=2;amud='a';}
  } else {
    if(amud==='b') amud='a';
    else if(daf>2){daf--;amud='b';}
    else if(idx>0){tractateEn=TRACTATES[idx-1].en;daf=TRACTATES[idx-1].daf;amud='b';}
  }
  return buildRef(tractateEn,daf,amud);
}

function toGematria(n){
  if(!n||n<=0) return '';
  const U=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const T=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const H=['','ק','ר','ש','ת'];
  const h=Math.floor(n/100),t=Math.floor((n%100)/10),u=n%10;
  let s=H[h]||'';
  if(t===1&&u===5) s+='טו';
  else if(t===1&&u===6) s+='טז';
  else s+=(T[t]||'')+(U[u]||'');
  return s;
}

async function fetchDay(){
  show('mainLoader');hide('mainBody');
  const d=new Date();d.setDate(d.getDate()+dateOffset);
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  currentGregDate=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

  // Greg display
  document.getElementById('gregDateDisplay').textContent=d.toLocaleDateString('he-IL');

  // Sefaria calendars
  try{
    const res=await fetch(`https://www.sefaria.org/api/calendars?year=${y}&month=${m}&day=${day}`);
    const data=await res.json();
    if(data.calendar_items){
      const dafItem=data.calendar_items.find(c=>c.title&&c.title.en==='Daf Yomi');
      const tanyaItem=data.calendar_items.find(c=>c.title&&c.title.en==='Tanya Yomi');
      if(dafItem){
        dailyDafRef=dafItem.url||'';
        dailyDafHe=dafItem.displayValue&&dafItem.displayValue.he?dafItem.displayValue.he:'';
      }
      if(tanyaItem){
        dailyTanyaHe=tanyaItem.displayValue&&tanyaItem.displayValue.he?`תניא - ${tanyaItem.displayValue.he}`:'תניא יומי';
      }
    }
  }catch(e){showError('לא הצלחתי לטעון מהשרת. מציג ברירת מחדל.');}

  // Hebrew date
  try{
    const hres=await fetch(`https://www.hebcal.com/converter?cfg=json&date=${currentGregDate}&g2h=1&strict=1`);
    const hdata=await hres.json();
    if(hdata.hebrew){
      currentHebDate=hdata.hebrew.replace(/[\u0591-\u05C7]/g,'');
      document.getElementById('hebDateDisplay').textContent=currentHebDate;
      // Calendar month/year from hebcal
      if(hdata.hm&&hdata.hy){
        calYear=y;calMonth=d.getMonth();
      }
    }
  }catch(e){document.getElementById('hebDateDisplay').textContent=d.toLocaleDateString('he-IL');}

  renderUI();
  renderCalendar();
  hide('mainLoader');show('mainBody');
  document.getElementById('mainBody').classList.add('fade');
}

// ═══════════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════════
const HEB_MONTHS_HE=['ניסן','אייר','סיון','תמוז','אב','אלול','תשרי','חשון','כסלו','טבת','שבט','אדר','אדר א׳','אדר ב׳'];
const GREG_MONTHS_HE=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

async function renderCalendar(){
  const d1=new Date(calYear,calMonth,1);
  const totalDays=new Date(calYear,calMonth+1,0).getDate();
  // Day of week for first (0=Sun..6=Sat)
  let startDow=d1.getDay(); // 0=Sun

  document.getElementById('calGregSub').textContent=`${GREG_MONTHS_HE[calMonth]} ${calYear}`;

  // Build grid cells
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';

  // Fetch Hebrew dates for this month if needed
  const cacheKey=`${calYear}-${calMonth}`;
  if(!calData[cacheKey]){
    calData[cacheKey]={};
    try{
      // Fetch first, middle and last days to get Hebrew month name
      const midDate=new Date(calYear,calMonth,15);
      const ymid=midDate.getFullYear(),mmid=midDate.getMonth()+1,dmid=midDate.getDate();
      const r=await fetch(`https://www.hebcal.com/converter?cfg=json&date=${ymid}-${String(mmid).padStart(2,'0')}-${String(dmid).padStart(2,'0')}&g2h=1&strict=1`);
      const j=await r.json();
      if(j.hm) document.getElementById('calMonthTitle').textContent=`${j.hm} ${j.hy}`;
      else document.getElementById('calMonthTitle').textContent=`${GREG_MONTHS_HE[calMonth]} ${calYear}`;

      // Batch: fetch a few sample days to map hd
      const sampleDays=[1,8,15,22,totalDays];
      const results=await Promise.all(sampleDays.map(async dd=>{
        const dk=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
        try{
          const rr=await fetch(`https://www.hebcal.com/converter?cfg=json&date=${dk}&g2h=1&strict=1`);
          const jj=await rr.json();
          return {day:dd,hd:jj.hd,hm:jj.hm};
        }catch(e){return {day:dd,hd:dd,hm:''};}
      }));
      // Build simple approximation for all days
      results.forEach(r=>{calData[cacheKey][r.day]=r.hd;});
      // interpolate
      for(let dd=1;dd<=totalDays;dd++){
        if(!calData[cacheKey][dd]){
          // find nearest sample
          const s=results.reduce((a,b)=>Math.abs(b.day-dd)<Math.abs(a.day-dd)?b:a);
          calData[cacheKey][dd]=((s.hd||1)+(dd-s.day)+29)%30||30;
        }
      }
    }catch(e){
      document.getElementById('calMonthTitle').textContent=`${GREG_MONTHS_HE[calMonth]} ${calYear}`;
      for(let dd=1;dd<=totalDays;dd++) calData[cacheKey][dd]=dd;
    }
  }

  // Blank cells for day-of-week alignment
  for(let i=0;i<startDow;i++){
    const blank=document.createElement('div');
    blank.className='cal-cell empty';
    grid.appendChild(blank);
  }

  const today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  for(let dd=1;dd<=totalDays;dd++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const cell=document.createElement('div');
    cell.className='cal-cell';
    const dow=(startDow+dd-1)%7; // 0=Sun,6=Sat
    if(dow===6) cell.classList.add('shabbat');
    if(dateStr===todayStr&&dateOffset===0) cell.classList.add('today');
    else if(dateStr===currentGregDate) cell.classList.add('selected');

    // Check learned for gemara or tanya
    const gLearned=isLearned(dateStr,'gemara');
    const tLearned=isLearned(dateStr,'tanya');
    if(gLearned||tLearned) cell.classList.add('learned');

    const hd=calData[cacheKey]&&calData[cacheKey][dd]?toGematria(calData[cacheKey][dd]):String(dd);
    cell.innerHTML=`<span class="hday">${hd}</span><span class="gday">${dd}</span>`;
    cell.onclick=()=>selectCalDay(dateStr,dd);
    grid.appendChild(cell);
  }
}

function selectCalDay(dateStr, day){
  // Calculate offset from today
  const today=new Date();today.setHours(0,0,0,0);
  const target=new Date(dateStr);target.setHours(0,0,0,0);
  dateOffset=Math.round((target-today)/(1000*60*60*24));
  fetchDay();
}

function prevCalMonth(){
  calMonth--;if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function nextCalMonth(){
  calMonth++;if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

function moveDaf(dir){
  if(dir>0){
    if(customAmud==='a') customAmud='b';
    else if(customDaf<(TRACTATES.find(t=>t.en===customTractateEn)||{daf:64}).daf){customDaf++;customAmud='a';}
  } else {
    if(customAmud==='b') customAmud='a';
    else if(customDaf>2){customDaf--;customAmud='b';}
  }
  buildDafSelect();
  document.getElementById('customDaf').value=customDaf;
  document.getElementById('customAmud').value=customAmud;
}
function moveTanya(dir){
  const max=(TANYA_SECTIONS.find(s=>s.en===customSectionEn)||{max:53}).max;
  if(dir>0&&customChapter<max) customChapter++;
  else if(dir<0&&customChapter>1) customChapter--;
  document.getElementById('customChapter').value=customChapter;
}
function onSectionChange(){
  customSectionEn=document.getElementById('customSection').value;
  customChapter=1;
  buildChapterSelect();
}

function toggleLearn(){
  const type=masterMode==='gemara'?'gemara':'tanya';
  const dateKey=currentGregDate;
  const was=isLearned(dateKey,type);
  const now=!was;
  setLearned(dateKey,type,now);
  const oldStreak=getStreak(type);
  setStreak(type,now?oldStreak+1:Math.max(0,oldStreak-1));
  if(now) learnedDates[dateKey+':'+type]=true;
  else delete learnedDates[dateKey+':'+type];
  renderUI();
  renderCalendar();
}

// ═══════════════════════════════════════════════
// BEIT MIDRASH ENTRY
// ═══════════════════════════════════════════════
function getCurrentRef(){
  if(masterMode==='gemara'){
    if(studyMode==='daily'){
      if(!dailyDafRef) return null;
      // Clean up the ref from Sefaria URL format
      return dailyDafRef.replace(/^\/+/,'').replace(/\//g,'.');
    }
    const t=document.getElementById('customTractate').value||customTractateEn;
    const d=parseInt(document.getElementById('customDaf').value)||customDaf;
    const a=document.getElementById('customAmud').value||customAmud;
    return buildRef(t,d,a);
  } else {
    if(studyMode==='daily') return 'tanya_daily';
    const sec=document.getElementById('customSection').value||customSectionEn;
    const ch=parseInt(document.getElementById('customChapter').value)||customChapter;
    return `tanya_${sec}_${ch}`;
  }
}

function getCurrentTitle(){
  if(masterMode==='gemara'){
    if(studyMode==='daily') return dailyDafHe||dailyDafRef;
    const t=TRACTATES.find(x=>x.en===(document.getElementById('customTractate').value||customTractateEn));
    const d=parseInt(document.getElementById('customDaf').value)||customDaf;
    const a=document.getElementById('customAmud').value||customAmud;
    return `${t?t.he:''} דף ${toGematria(d)} ע${a==='a'?'א':'ב'}`;
  }
  if(studyMode==='daily') return dailyTanyaHe||'תניא יומי';
  const sec=TANYA_SECTIONS.find(s=>s.en===(document.getElementById('customSection').value||customSectionEn));
  const ch=parseInt(document.getElementById('customChapter').value)||customChapter;
  return `תניא - ${sec?sec.he:''} פרק ${toGematria(ch)}`;
}

function enterBeitMidrash(){
  const ref=getCurrentRef();
  if(!ref) return;
  overlayRef=ref;
  overlayMaster=masterMode;
  document.getElementById('overlayTitle').textContent=getCurrentTitle();
  document.getElementById('dafNav').classList.toggle('hidden',masterMode!=='gemara');
  buildTabs();
  show('studyOverlay');
}

function closeOverlay(){hide('studyOverlay');}

// ═══════════════════════════════════════════════
// TABS & TEXT
// ═══════════════════════════════════════════════
const TABS_GEMARA=[
  {id:'scan',label:'צורת הדף'},
  {id:'gemara',label:'גמרא'},
  {id:'explanation',label:'ביאור'},
  {id:'rashi',label:'רש"י'},
  {id:'tosafot',label:'תוספות'}
];
const TABS_TANYA=[
  {id:'tanya_orig',label:'תניא'},
  {id:'tanya_explain',label:'ביאור'}
];

function buildTabs(){
  const tabs=overlayMaster==='gemara'?TABS_GEMARA:TABS_TANYA;
  const container=document.getElementById('overlayTabs');
  container.innerHTML='';
  tabs.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='tab'+(i===0?' active':'');
    btn.textContent=t.label;
    btn.id='tab_'+t.id;
    btn.onclick=()=>switchTab(t.id);
    container.appendChild(btn);
  });
  activeTab=tabs[0].id;
  loadTab(activeTab);
  // notes
  const noteKey=getNoteKey(overlayRef);
  document.getElementById('notesTa').value=getNote(overlayRef);
}

function switchTab(tabId){
  activeTab=tabId;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('tab_'+tabId);
  if(btn) btn.classList.add('active');
  loadTab(tabId);
}

async function loadTab(tabId){
  const content=document.getElementById('tabContent');
  if(tabId==='scan'){
    const parsed=parseDafRef(overlayRef);
    let url='https://daf-yomi.com/';
    if(parsed){
      url=getDafYomiUrl(parsed.tractateEn,parsed.daf,parsed.amud);
    }
    content.innerHTML=`<div class="portal-card">
      <div class="portal-icon">📄</div>
      <div class="portal-title">צורת הדף</div>
      <div class="portal-desc">לצפייה בצורת הדף בפורטל הדף היומי עם כל הפרשנים</div>
      <a href="${url}" target="_blank" rel="noopener" class="portal-btn">פתח פורטל הדף היומי</a>
    </div>`;
    return;
  }
  if(tabId==='tanya_orig'||tabId==='tanya_explain'){
    content.innerHTML=`<div class="portal-card">
      <div class="portal-icon">📘</div>
      <div class="portal-title">תניא יומי</div>
      <div class="portal-desc">הטקסט והביאור נפתחים ישירות באתר חב"ד עם כל הכלים</div>
      <a href="https://he.chabad.org/dailystudy/tanya.htm" target="_blank" rel="noopener" class="portal-btn">פתח תניא באתר חב"ד</a>
    </div>`;
    return;
  }
  // Text tabs
  content.innerHTML=`<div class="loader"><div class="spin"></div><p style="font-family:'Frank Ruhl Libre',serif;color:var(--ink3);">טוען...</p></div>`;
  const url=buildTextUrl(tabId,overlayRef);
  if(!url){content.innerHTML=`<div class="portal-card"><div class="portal-desc">אין תוכן להצגה בלשונית זו.</div></div>`;return;}
  try{
    const res=await fetch(url,{headers:{Accept:'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const txt=await res.text();
    if(!txt.trim()||txt.trim().startsWith('<')) throw new Error('לא JSON');
    const data=JSON.parse(txt);
    const arr=Array.isArray(data.he)?data.he.flat(Infinity):[data.he];
    const paragraphs=arr.filter(p=>typeof p==='string'&&p.trim());
    if(!paragraphs.length) throw new Error('אין תוכן');
    content.innerHTML=`<div class="gemara-text" dir="rtl">${paragraphs.map(p=>`<p>${p}</p>`).join('')}</div>`;
  }catch(e){
    // Try fallback URLs
    const fallbacks=buildFallbackUrls(tabId,overlayRef);
    let found=false;
    for(const fu of fallbacks){
      try{
        const r=await fetch(fu,{headers:{Accept:'application/json'}});
        if(!r.ok) continue;
        const t=await r.text();
        if(!t.trim()||t.trim().startsWith('<')) continue;
        const d=JSON.parse(t);
        const a=Array.isArray(d.he)?d.he.flat(Infinity):[d.he];
        const p=a.filter(x=>typeof x==='string'&&x.trim());
        if(p.length){
          content.innerHTML=`<div class="gemara-text" dir="rtl">${p.map(x=>`<p>${x}</p>`).join('')}</div>`;
          found=true;break;
        }
      }catch(ee){}
    }
    if(!found){
      content.innerHTML=`<div class="portal-card">
        <div class="portal-icon">🔍</div>
        <div class="portal-title">לא נמצא תוכן</div>
        <div class="portal-desc">${e.message||'לא הצלחתי לטעון תוכן לדף הזה ממאגר ספריא'}</div>
        <a href="https://www.sefaria.org/${encodeURIComponent(overlayRef)}" target="_blank" rel="noopener" class="portal-btn">פתח בספריא ישירות</a>
      </div>`;
    }
  }
}

function buildTextUrl(tabId,ref){
  const clean=ref.replace(/\//g,'.');
  const enc=encodeURIComponent(clean);
  if(tabId==='gemara') return `https://www.sefaria.org/api/texts/${enc}`;
  if(tabId==='explanation') return `https://www.sefaria.org/api/texts/Steinsaltz_on_${enc}`;
  if(tabId==='rashi') return `https://www.sefaria.org/api/texts/Rashi_on_${enc}`;
  if(tabId==='tosafot') return `https://www.sefaria.org/api/texts/Tosafot_on_${enc}`;
  return '';
}

function buildFallbackUrls(tabId,ref){
  if(tabId!=='tosafot') return [];
  const clean=ref.replace(/\//g,'.');
  const noAmud=clean.replace(/\.[0-9]+(a|b)$/,'');
  return [
    `https://www.sefaria.org/api/texts/Tosafot_on_${encodeURIComponent(noAmud)}`,
    `https://www.sefaria.org/api/texts/Tosafot%20on%20${encodeURIComponent(clean.replace('.',' '))}`,
  ];
}

function navigateDaf(dir){
  if(overlayMaster!=='gemara') return;
  overlayRef=getAdjacentRef(overlayRef,dir);
  const parsed=parseDafRef(overlayRef);
  if(parsed){
    const t=TRACTATES.find(x=>x.en===parsed.tractateEn);
    document.getElementById('overlayTitle').textContent=`${t?t.he:parsed.tractateEn} דף ${toGematria(parsed.daf)} ע${parsed.amud==='a'?'א':'ב'}`;
  }
  loadTab(activeTab);
}

function toggleNotes(){
  const area=document.getElementById('notesArea');
  area.classList.toggle('hidden');
}

function saveNote(){
  const v=document.getElementById('notesTa').value;
  saveNoteVal(overlayRef,v);
}

// ═══════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════
function showHistory(){
  const container=document.getElementById('histContent');
  const entries=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('learned_')&&localStorage.getItem(k)==='1'){
        const parts=k.split('_');
        if(parts.length>=3){
          const type=parts[1];
          const dateKey=parts.slice(2).join('_');
          entries.push({type,dateKey});
        }
      }
    }
  }catch(e){}

  entries.sort((a,b)=>b.dateKey.localeCompare(a.dateKey));

  if(!entries.length){
    container.innerHTML=`<div style="text-align:center;color:var(--ink3);padding:40px;font-family:'Noto Serif Hebrew',serif;font-size:18px;">עדיין לא סימנת לימודים</div>`;
  } else {
    container.innerHTML=entries.map(e=>`
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:white;border-radius:12px;margin-bottom:8px;border:1px solid var(--parchment3);">
        <span style="font-family:'Noto Serif Hebrew',serif;font-size:15px;font-weight:700;">${e.dateKey}</span>
        <span style="background:${e.type==='gemara'?'rgba(26,58,124,0.1)':'rgba(26,92,58,0.1)'};color:${e.type==='gemara'?'var(--blue)':'var(--green)'};padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;">${e.type==='gemara'?'גמרא':'תניא'} ✓</span>
      </div>
    `).join('');
  }
  show('histModal');
}
function closeHistory(){hide('histModal');}

function hide(id){document.getElementById(id).classList.add('hidden');}
function showError(msg){
  const b=document.getElementById('errorBox');
  b.textContent=msg;b.classList.remove('hidden');
}
