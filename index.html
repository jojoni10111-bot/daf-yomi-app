<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>בית המדרש הדיגיטלי</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="בית המדרש" />
<meta name="theme-color" content="#2a1016" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#2a1016;
  --card:#3a1820;
  --card2:#4a212b;
  --ink:#f5e9ea;
  --muted:#c19aa0;
  --line:rgba(255,255,255,.10);
  --navy:#542833;
  --navy2:#63323e;
  --gold:#e0b95c;
  --gold2:#f3d585;
  --green:#52c294;
  --blue:#c9a84c;
  --red:#e0697a;
  --shadow:0 28px 90px rgba(0,0,0,.55);
  --soft:0 12px 32px rgba(0,0,0,.40);
  --r:30px;
  --font:'Rubik',sans-serif;
}
html,body{min-height:100%}
body{
  min-height:100vh;
  direction:rtl;
  color:var(--ink);
  font-family:var(--font);
  text-align:center;
  background:#2a1016;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;
}
button,select,textarea{font-family:inherit}
button{border:0;cursor:pointer}
#app{
  position:relative;z-index:1;
  width:min(100%,520px);
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 8px;
}
.app-shell{
  width:100%;
  min-height:calc(100vh - 20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:28px;
  background:#3a1820;
  box-shadow:var(--shadow);
}

/* ── HERO (compact) ── */
.hero{
  position:relative;overflow:hidden;
  width:100%;
  padding:16px 14px 12px;
  color:var(--ink);
  background:#3a1820;
  border-radius:0 0 26px 26px;
  border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.hero:before{content:"";display:none}
.hero:after{content:"";display:none}
.topbar{position:relative;z-index:1;width:100%;min-height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.brand{text-align:center;line-height:1.1}.brand strong{display:block;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.03em}.brand span{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--muted)}
.user-corner{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:2}
.user-name{font-size:12px;font-weight:700;color:var(--gold2);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.user-name:empty{display:none}
.streak{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:60px;height:30px;padding:0 10px;background:rgba(224,185,92,.12);border:1px solid rgba(224,185,92,.25);border-radius:999px;color:var(--gold);font-weight:800;font-size:13px}
.streak svg{width:14px;height:14px;fill:currentColor}
.mode-tabs{position:relative;z-index:1;width:100%;max-width:400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:4px;border-radius:16px;background:#4a212b;border:1px solid var(--line)}
.mode-tab{height:36px;border-radius:12px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;transition:.18s;text-align:center}.mode-tab.active{background:var(--gold);color:#200a0f}.mode-tab.history{padding:0;color:var(--ink);border:1px solid var(--line)}
.today-panel{position:relative;z-index:1;width:100%;max-width:400px;margin:10px auto 0;padding:10px 12px;border-radius:18px;background:#4a212b;border:1px solid var(--line);text-align:center}
.date-line{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:8px}.date-nav-btn{width:36px;height:36px;border-radius:12px;background:#542833;border:1px solid var(--line);color:var(--ink);font-size:20px}.date-center{text-align:center;min-width:0}.date-center .hdate{color:var(--ink);font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.01em}.date-center .gdate{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}.calendar-toggle{margin:8px auto 0;width:100%;max-width:220px;height:32px;border-radius:999px;background:#542833;border:1px solid var(--line);color:var(--gold);font-weight:700;font-size:12px;text-align:center}

/* ── MAIN (compact) ── */
.main{width:100%;max-width:430px;flex:1;padding:12px 10px 16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;text-align:center}

.gemara-combo .combo-segment{display:flex;flex-direction:column;gap:8px;text-align:right}
.combo-label{display:inline-flex;align-self:flex-start;background:rgba(224,185,92,.12);color:var(--gold);border:1px solid rgba(224,185,92,.2);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;line-height:1}
.combo-label-biur{background:#542833;color:var(--ink);border-color:var(--line)}
.combo-gemara{font-weight:700;color:var(--ink)}
.combo-biur{color:var(--muted);line-height:1.85}

.mode-tab.active,.open-btn,.portal-btn{box-shadow:none}
.study-card,.cal-drawer,.portal-box{box-shadow:0 12px 40px rgba(0,0,0,.35)}
.tab.active{box-shadow:inset 0 -3px 0 var(--gold)}
.date-nav-btn:hover,.daf-nav-btn:hover,.month-nav:hover{filter:brightness(1.12)}
.hidden{display:none!important}.fade{animation:fade .24s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.full-loader,.loader{width:100%;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;color:var(--muted);font-weight:700;text-align:center}.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#mainBody{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

/* ── STUDY CARD (compact) ── */
.study-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--soft);overflow:hidden;text-align:center}.study-card-header{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:10px 12px;background:#4a212b;border-bottom:1px solid var(--line);text-align:center}.study-card-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em}.badges{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}.badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700}.badge-gemara{background:rgba(224,185,92,.14);color:var(--gold)}.badge-tanya{background:rgba(74,186,135,.12);color:var(--green)}.badge-daily{background:#542833;color:var(--ink)}.badge-custom{background:#542833;color:var(--gold)}.study-card-body{padding:12px;text-align:center}.study-mode-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#4a212b;border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 auto 10px;max-width:320px}.study-mode-btn{height:36px;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:700;text-align:center}.study-mode-btn.active{background:#63323e;color:var(--ink)}

.daily-block{position:relative;overflow:hidden;border-radius:20px;background:#4a212b;border:1px solid var(--line);padding:16px 14px;text-align:center}.daily-title{font-size:28px;line-height:1.15;font-weight:800;color:var(--ink);margin:0 auto 6px;letter-spacing:-.04em;text-align:center}.daily-subtitle{font-size:12px;color:var(--muted);font-weight:700;min-height:16px;text-align:center}.quick-actions{display:grid;grid-template-columns:1fr;gap:8px;margin:12px auto 0;max-width:280px}.learn-btn,.open-btn{width:100%;height:44px;border-radius:14px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}.learn-btn.idle{background:#542833;border:1px solid var(--line);color:var(--ink)}.learn-btn.done{background:var(--green);color:#200a0f}.open-btn{background:var(--gold);color:#200a0f}

.picker-row{display:flex;justify-content:center;align-items:center;gap:6px}.picker-btn{width:38px;height:38px;background:#542833;border:1px solid var(--line);border-radius:12px;color:var(--gold);font-size:16px;font-weight:800}.picker-select{width:100%;height:40px;background:#4a212b;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;color:var(--ink);font-size:14px;font-weight:700;outline:none;text-align:center;text-align-last:center;appearance:none}.picker-select:focus{border-color:var(--gold)}
.enter-btn{width:100%;max-width:320px;height:50px;border-radius:18px;background:var(--gold);color:#200a0f;font-size:17px;font-weight:800;text-align:center}.enter-btn:active,.open-btn:active,.learn-btn:active{transform:scale(.985)}
.error-box{width:100%;background:rgba(224,185,92,.08);border:1px solid rgba(224,185,92,.2);border-radius:14px;padding:10px 12px;color:var(--gold2);font-size:12px;line-height:1.5;font-weight:700;text-align:center}

/* ── CALENDAR (compact) ── */
.cal-drawer{width:calc(100% - 20px);max-width:430px;margin:0 auto 10px;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--soft);text-align:center}.cal-head{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:8px;padding:10px;background:#4a212b;border-bottom:1px solid var(--line)}.month-nav{width:36px;height:36px;border-radius:12px;background:#542833;border:1px solid var(--line);font-size:16px;color:var(--ink);text-align:center}.cal-title{text-align:center;font-weight:800;font-size:15px;color:var(--ink)}.cal-title span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-wd{text-align:center;padding:6px 0 3px;font-size:10px;color:var(--muted);font-weight:700}.cal-grid{padding:4px 6px 8px}.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;text-align:center;font-size:13px;color:var(--ink)}.cal-cell:not(.empty):hover{background:#542833}.cal-cell.empty{opacity:0}.cal-cell.today{background:var(--gold);color:#200a0f}.cal-cell.selected:not(.today):not(.learned){outline:2px solid var(--gold);background:rgba(224,185,92,.12)}.cal-cell.learned{background:var(--green);color:#200a0f}.cal-cell.learned:after{content:"✓";position:absolute;left:3px;top:2px;font-size:8px;font-weight:800}.cal-cell.shabbat:not(.today):not(.learned){color:var(--red)}.hday{font-size:8px;color:currentColor;opacity:.55;text-align:center}.gday{font-size:12px;font-weight:700;color:currentColor;text-align:center}

/* ── OVERLAY (compact) ── */
.overlay,.hist-modal{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;animation:slideUp .25s ease-out;text-align:center}@keyframes slideUp{from{transform:translateY(100%);opacity:.8}to{transform:none;opacity:1}}.overlay-header,.hist-header{width:100%;background:#3a1820;padding:12px 12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-align:center}.overlay-top,.hist-top{width:100%;max-width:560px;margin:0 auto 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.overlay-title,.hist-title{max-width:100%;font-size:18px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.overlay-actions{display:flex;justify-content:center;align-items:center;gap:6px;flex-shrink:0}.small-dark{height:32px;padding:0 12px;border-radius:10px;background:#542833;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:13px;text-align:center}.notes-btn{color:var(--gold)}.daf-nav{width:100%;max-width:400px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:8px}.daf-nav-btn{height:36px;border-radius:12px;background:#542833;border:1px solid var(--line);color:var(--gold);font-size:13px;font-weight:700;text-align:center}.tabs{width:100%;display:flex;justify-content:center;background:#3a1820;border-bottom:1px solid var(--line);overflow-x:auto}.tab{flex:1;min-width:72px;max-width:130px;height:40px;background:transparent;color:var(--muted);border-bottom:3px solid transparent;font-size:12px;font-weight:700;text-align:center}.tab.active{color:var(--gold);border-bottom-color:var(--gold);background:#4a212b}.tab-content{width:100%;max-width:760px;flex:1;overflow-y:auto;padding:12px;text-align:center}
.welcome-modal{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.welcome-box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:var(--soft)}
.welcome-title{font-size:24px;font-weight:800;color:var(--gold);margin-bottom:6px;letter-spacing:-.02em}
.welcome-sub{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:18px}
.welcome-input{width:100%;height:46px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--ink);font-size:15px;font-weight:600;outline:none;text-align:center;margin-bottom:10px}
.welcome-input:focus{border-color:var(--gold)}
.welcome-input::placeholder{color:var(--muted)}
.welcome-err{font-size:12px;color:var(--red);font-weight:700;min-height:16px;margin-bottom:6px}
.welcome-btn{width:100%;height:48px;border-radius:14px;background:var(--gold);color:#200a0f;font-size:16px;font-weight:800;margin-top:4px}
.welcome-btn:active{transform:scale(.98)}

/* ── TEXT STYLES ── */
.gemara-text{font-size:18px;line-height:2;color:var(--ink);text-align:center}.gemara-text p{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:18px;padding:14px;margin:0 auto 12px;max-width:680px;text-align:center}.gemara-text b{font-weight:800;color:var(--ink)}.section-title{display:inline-flex;align-items:center;justify-content:center;margin:0 auto 10px;padding:6px 14px;border-radius:999px;background:rgba(224,185,92,.12);color:var(--gold);font-size:14px;font-weight:800;border:1px solid rgba(224,185,92,.25)}

/* ── PORTAL / SCAN ── */
.portal-card{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:50vh}.portal-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 16px;box-shadow:var(--soft);text-align:center}.portal-mark{width:48px;height:48px;border-radius:16px;margin:0 auto 10px;background:rgba(224,185,92,.12);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:1px solid rgba(224,185,92,.25)}.portal-title{font-size:22px;font-weight:800;margin-bottom:6px;text-align:center;color:var(--ink)}.portal-desc{font-size:13px;color:var(--muted);line-height:1.6;font-weight:600;text-align:center}.portal-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;height:44px;border-radius:14px;background:var(--gold);color:#200a0f;font-size:15px;font-weight:800;margin:12px auto 0;text-align:center}.portal-secondary{background:#542833;color:var(--ink);border:1px solid var(--line);margin-top:6px}
.scan-frame{width:100%;max-width:900px;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#3a1820}
.scan-frame iframe{width:100%;height:calc(100vh - 150px);border:0;display:block}
.scan-fallback{padding:12px;text-align:center;font-size:13px;color:var(--muted)}
.scan-fallback a{color:var(--gold);font-weight:700;text-decoration:underline}
.scan-fs-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 18px;margin:0 auto 8px;border-radius:12px;background:var(--gold);color:#200a0f;font-size:14px;font-weight:800}
.scan-fs-btn:active{transform:scale(.97)}
.scan-fullscreen{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
.scan-fs-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#3a1820;border-bottom:1px solid var(--line)}
.scan-fs-title{font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:right}
.scan-fs-close{flex-shrink:0;height:34px;padding:0 16px;border-radius:10px;background:var(--navy);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:13px}
.scan-zoom{display:flex;align-items:center;gap:4px;flex-shrink:0}
.scan-zoom button{width:36px;height:34px;border-radius:9px;background:var(--navy);border:1px solid var(--line);color:var(--gold);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.scan-zoom button:active{transform:scale(.92)}
.scan-zoom .zlabel{min-width:48px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.scan-fs-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#1f0b10}
.scan-fs-inner{transform-origin:top center;transition:transform .12s ease-out;width:100%}
.scan-fs-inner iframe{width:100%;height:calc(100vh - 56px);border:0;display:block}

.notes-area{width:100%;padding:8px 12px;background:#4a212b;border-bottom:1px solid var(--line);text-align:center}.notes-label{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:4px;text-align:center}.notes-ta{width:100%;max-width:560px;min-height:80px;resize:vertical;background:#3a1820;border:1px solid var(--line);border-radius:14px;padding:10px;color:var(--ink);font-size:14px;line-height:1.5;outline:none;text-align:center}
.hist-header{padding:14px 12px}.hist-content{width:100%;max-width:520px;flex:1;overflow:auto;padding:12px;text-align:center}.hist-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:0 auto 8px;text-align:center}.hist-row strong{font-size:14px;font-weight:700;color:var(--ink)}.hist-row span{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}.hist-g{background:rgba(224,185,92,.14);color:var(--gold)}.hist-t{background:rgba(74,186,135,.12);color:var(--green)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#63323e;border-radius:99px}
@media(max-width:390px){#app{padding:0}.app-shell{border-radius:0;min-height:100vh}.brand strong{font-size:21px}.brand span{font-size:11px}.user-name{max-width:78px;font-size:11px}.daily-title{font-size:24px}.mode-tab{font-size:13px}.quick-actions{max-width:none}}
</style>
</head>
<body>
<div id="app">
  <div class="app-shell">
    <header class="hero">
      <div class="topbar">
        <div class="user-corner" id="userCorner">
          <div class="user-name" id="userNameDisplay"></div>
          <div id="streakBadge" class="streak" title="רצף לימוד">
            <svg viewBox="0 0 24 24"><path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14zm0 17a3 3 0 0 1-3-3c0-3 3-4 3-7 0 3 3 4 3 7a3 3 0 0 1-3 3z"/></svg>
            <span id="streakNum">0</span>
          </div>
        </div>
        <div class="brand"><strong>בית המדרש</strong><span>הלימוד היומי שלך</span></div>
      </div>
      <nav class="mode-tabs">
        <button class="mode-tab active" id="tabGemara" onclick="setMaster('gemara')">גמרא</button>
        <button class="mode-tab" id="tabTanya" onclick="setMaster('tanya')">תניא</button>
        <button class="mode-tab history" id="tabHistory" onclick="showHistory()">היסטוריה</button>
      </nav>
      <section class="today-panel">
        <div class="date-line">
          <button class="date-nav-btn" onclick="shiftDate(-1)" aria-label="היום הקודם">‹</button>
          <div class="date-center">
            <div class="hdate" id="hebDateDisplay">טוען...</div>
            <div class="gdate" id="gregDateDisplay"></div>
          </div>
          <button class="date-nav-btn" onclick="shiftDate(1)" aria-label="היום הבא">›</button>
        </div>
        <button class="calendar-toggle" onclick="toggleCalendar()" id="calendarToggle">פתח לוח חודשי</button>
      </section>
    </header>

    <section id="calContainer" class="cal-drawer hidden">
      <div class="cal-head">
        <button class="month-nav" onclick="prevCalMonth()">›</button>

const GREG_MONTHS_HE=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function stripHebrewNikud(s){return String(s||'').replace(/[֑-ׇ]/g,'').replace(/\s+/g,' ').trim()}
function hebrewMonthPart(row){
  const h=stripHebrewNikud(row&&row.hebrew);
  const m=h.match(/^[^ ]+\s+ב?([^ ]+)\s+(.+)$/);
  if(!m)return{month:(row&&row.hm)||'',year:(row&&row.hy)||''};
  return{month:m[1],year:m[2]};
}
function formatHebrewMonthTitle(first,last,mid){
  const a=hebrewMonthPart(first),b=hebrewMonthPart(last),c=hebrewMonthPart(mid||first);
  if(a.month&&b.month&&a.month!==b.month)return`${a.month} / ${b.month} ${b.year||a.year||c.year}`.trim();
  return`${c.month||a.month||b.month} ${c.year||a.year||b.year}`.trim();
}
const DAY_MS=86400000;
const CACHE_TTL=24*60*60*1000;

function ls(k,def=''){try{return localStorage.getItem(k)||def}catch(e){return def}}
function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsr(k){try{localStorage.removeItem(k)}catch(e){}}
function isLearned(dateKey,type){return ls(`learned_${type}_${dateKey}`)==='1'}
function setLearned(dateKey,type,v){v?lss(`learned_${type}_${dateKey}`,'1'):lsr(`learned_${type}_${dateKey}`)}
function getNote(ref){return ls(`note_${ref}`,'')}
function saveNoteVal(ref,v){lss(`note_${ref}`,v)}
function cacheKey(url){return'cache_v2_'+url}
async function cachedJSON(url,ttl=CACHE_TTL){
  const key=cacheKey(url);
  try{const raw=localStorage.getItem(key);if(raw){const obj=JSON.parse(raw);if(Date.now()-obj.t<ttl)return obj.v}}catch(e){}
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const val=await res.json();
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),v:val}))}catch(e){}
  return val;
}
async function cachedText(url,ttl=CACHE_TTL){
  const key=cacheKey('text_'+url);
  try{const raw=localStorage.getItem(key);if(raw){const obj=JSON.parse(raw);if(Date.now()-obj.t<ttl)return obj.v}}catch(e){}
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const val=await res.text();
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),v:val}))}catch(e){}
  return val;
}

function dateKeyFromDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDaysKey(key,delta){const d=new Date(key+'T00:00:00');d.setDate(d.getDate()+delta);return dateKeyFromDate(d)}
function todayKey(){return dateKeyFromDate(new Date())}
function calcStreak(type){
  let anchor=todayKey();
  if(!isLearned(anchor,type)&&isLearned(addDaysKey(anchor,-1),type))anchor=addDaysKey(anchor,-1);
  let count=0,cur=anchor;
  while(isLearned(cur,type)){count++;cur=addDaysKey(cur,-1)}
  return count;
}
/* daf-yomi.com uses massechet + amud params.
   massechet id = 283 + tractate index (sequential by Shas order, verified: Berakhot=283, Shabbat=284, Eruvin=285, Pesachim=286, Chullin=313).
   amud = running page count within the masechet: daf 2a -> 3, 2b -> 4, i.e. (daf-1)*2 + (amud==='b'?2:1). */
function getDafYomiMassechet(tractateEn){
  const idx=TRACTATES.findIndex(t=>t.en===tractateEn);
  if(idx<0)return null;
  return 283+idx;
}
function getDafYomiAmud(daf,amud){
  if(daf<2)return null;
  return (daf-1)*2+(amud==='b'?2:1);
}
function getDafYomiPortalUrl(tractateEn,daf,amud){
  const m=getDafYomiMassechet(tractateEn);
  const a=getDafYomiAmud(daf,amud);
  return (m&&a)?`https://daf-yomi.com/Dafyomi_Page.aspx?vt=1&massechet=${m}&amud=${a}&fs=0`:'https://daf-yomi.com/';
}
function normalizeDafRef(ref){
  if(!ref)return'';
  let s=String(ref).trim().replace(/^https?:\/\/www\.sefaria\.org\//,'').replace(/^https?:\/\/sefaria\.org\//,'').replace(/^\/+/,'').replace(/\?.*$/,'').replace(/\//g,'.').replace(/_/g,' ').trim();
  let m=s.match(/^(.+?)[\s.]+(\d+)(a|b)$/i);
  if(m)return`${m[1].trim().replace(/ /g,'_')}.${parseInt(m[2],10)}${m[3].toLowerCase()}`;
  m=s.match(/^(.+?)[\s.]+(\d+)$/i);
  if(m)return`${m[1].trim().replace(/ /g,'_')}.${parseInt(m[2],10)}a`;
  return s.replace(/ /g,'_');
}
function parseDafRef(ref){
  const s=normalizeDafRef(ref).replace(/_/g,' ');
  const m=s.match(/^(.+?)\.(\d+)(a|b)$/i);
  if(!m)return null;
  return{tractateEn:m[1].replace(/ /g,'_'),daf:parseInt(m[2],10),amud:m[3].toLowerCase()};
}
function buildRef(tractateEn,daf,amud){return`${tractateEn}.${daf}${amud}`}
function getAdjacentRef(ref,dir){const p=parseDafRef(ref);if(!p)return ref;const idx=TRACTATES.findIndex(t=>t.en===p.tractateEn);if(idx<0)return ref;let{tractateEn,daf,amud}=p;const maxDaf=TRACTATES[idx].daf;if(dir>0){if(amud==='a')amud='b';else if(daf<maxDaf){daf++;amud='a'}else if(TRACTATES[idx+1]){tractateEn=TRACTATES[idx+1].en;daf=2;amud='a'}}else{if(amud==='b')amud='a';else if(daf>2){daf--;amud='b'}else if(idx>0){tractateEn=TRACTATES[idx-1].en;daf=TRACTATES[idx-1].daf;amud='b'}}return buildRef(tractateEn,daf,amud)}
function toGematria(n){if(!n||n<=0)return'';const U=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],T=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],H=['','ק','ר','ש','ת'];const h=Math.floor(n/100),t=Math.floor((n%100)/10),u=n%10;let s=H[h]||'';if(t===1&&u===5)s+='טו';else if(t===1&&u===6)s+='טז';else s+=(T[t]||'')+(U[u]||'');return s}
function tanyaRef(sectionEn,chapter){const sec=TANYA_SECTIONS.find(s=>s.en===sectionEn)||TANYA_SECTIONS[0];return`${sec.sefaria}.${chapter}`}
function flattenTextArray(value){return(Array.isArray(value)?value.flat(Infinity):[value]).filter(x=>typeof x==='string'&&x.trim())}
function getHebTextArray(data){for(const c of[data&&data.he,data&&data.text,data&&data.heRefText]){const out=flattenTextArray(c);if(out.length)return out}return[]}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}

window.addEventListener('DOMContentLoaded',()=>{buildTractateSelect();buildDafSelect();buildSectionSelect();buildChapterSelect();loadLearnedDates();initUserName();fetchDay()});

function loadLearnedDates(){learnedDates={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('learned_')&&localStorage.getItem(k)==='1'){const parts=k.split('_');if(parts.length>=3){const type=parts[1],dateKey=parts.slice(2).join('_');learnedDates[dateKey+':'+type]=true}}}}catch(e){}}
function buildTractateSelect(){const sel=document.getElementById('customTractate');sel.innerHTML='';TRACTATES.forEach(t=>{const o=document.createElement('option');o.value=t.en;o.textContent=t.he;sel.appendChild(o)});sel.onchange=e=>{customTractateEn=e.target.value;customDaf=2;customAmud='a';buildDafSelect()}}

async function fetchDay(){
  show('mainLoader');hide('mainBody');hide('errorBox');
  const d=new Date();d.setDate(d.getDate()+dateOffset);
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();

  document.getElementById('gregDateDisplay').textContent=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  dailyDafRef='';dailyDafHe='';dailyTanyaHe='';
  try{
    const data=await cachedJSON(`https://www.sefaria.org/api/calendars?year=${y}&month=${m}&day=${day}`);
    if(data.calendar_items){
      const dafItem=data.calendar_items.find(c=>c.title&&c.title.en==='Daf Yomi');
      const tanyaItem=data.calendar_items.find(c=>c.title&&c.title.en==='Tanya Yomi');
      if(dafItem){dailyDafRef=normalizeDafRef(dafItem.url||dafItem.ref||dafItem.displayValue?.en||'');dailyDafHe=dafItem.displayValue&&dafItem.displayValue.he?dafItem.displayValue.he:(dafItem.ref||'דף יומי')}
      if(tanyaItem){dailyTanyaHe=tanyaItem.displayValue&&tanyaItem.displayValue.he?`תניא - ${tanyaItem.displayValue.he}`:'תניא יומי'}
    }
  }catch(e){showError('לא הצלחתי לטעון את הלימוד היומי מספריא. אפשר לבחור ידנית ב״בחירה חופשית״.')}
  try{
    const hdata=await cachedJSON(`https://www.hebcal.com/converter?cfg=json&date=${currentGregDate}&g2h=1&strict=1`);
    currentHebDate=hdata.hebrew?hdata.hebrew.replace(/[\u0591-\u05C7]/g,''):'';
    document.getElementById('hebDateDisplay').textContent=currentHebDate||d.toLocaleDateString('he-IL');
  }catch(e){document.getElementById('hebDateDisplay').textContent=d.toLocaleDateString('he-IL')}
  calYear=d.getFullYear();calMonth=d.getMonth();renderUI();renderCalendar();hide('mainLoader');show('mainBody');document.getElementById('mainBody').classList.add('fade')
}
function renderUI(){

async function getHebrewMonthData(year,month){
  const totalDays=new Date(year,month+1,0).getDate();
  const cache=`month_${year}_${month}`;
  if(calData[cache])return calData[cache];
  const promises=[];
  for(let dd=1;dd<=totalDays;dd++){
    const key=`${year}-${String(month+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    promises.push(cachedJSON(`https://www.hebcal.com/converter?cfg=json&date=${key}&g2h=1&strict=1`).then(j=>({day:dd,hd:j.hd,hm:j.hm,hy:j.hy,hebrew:j.hebrew})).catch(()=>({day:dd,hd:dd,hm:'',hy:''})));
  }
  const rows=await Promise.all(promises);
  const obj={days:{},title:''};
  rows.forEach(r=>{obj.days[r.day]=r});
  const first=rows[0],last=rows[rows.length-1],mid=rows[Math.min(14,rows.length-1)];
  obj.title=formatHebrewMonthTitle(first,last,mid);
  calData[cache]=obj;
  return obj;
}
async function renderCalendar(){
  const d1=new Date(calYear,calMonth,1),totalDays=new Date(calYear,calMonth+1,0).getDate(),startDow=d1.getDay(),grid=document.getElementById('calGrid');
  document.getElementById('calGregSub').textContent=`${GREG_MONTHS_HE[calMonth]} ${calYear}`;
  grid.innerHTML='';
  let monthData={days:{},title:`${GREG_MONTHS_HE[calMonth]} ${calYear}`};
  try{monthData=await getHebrewMonthData(calYear,calMonth)}catch(e){}
  document.getElementById('calMonthTitle').textContent=monthData.title||`${GREG_MONTHS_HE[calMonth]} ${calYear}`;
  for(let i=0;i<startDow;i++){const blank=document.createElement('div');blank.className='cal-cell empty';grid.appendChild(blank)}
  const todayStr=todayKey();
  for(let dd=1;dd<=totalDays;dd++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`,cell=document.createElement('div'),dow=(startDow+dd-1)%7;
    cell.className='cal-cell';
    if(dow===6)cell.classList.add('shabbat');
    if(dateStr===todayStr)cell.classList.add('today');
    if(dateStr===currentGregDate)cell.classList.add('selected');
    if(isLearned(dateStr,'gemara')||isLearned(dateStr,'tanya'))cell.classList.add('learned');
    const h=monthData.days[dd]||{};
    cell.innerHTML=`<span class="hday">${toGematria(h.hd||dd)}</span><span class="gday">${dd}</span>`;
    cell.onclick=()=>selectCalDay(dateStr);
    grid.appendChild(cell);
  }
}
function toggleCalendar(){const c=document.getElementById('calContainer'),b=document.getElementById('calendarToggle');c.classList.toggle('hidden');b.textContent=c.classList.contains('hidden')?'פתח לוח חודשי':'סגור לוח חודשי'}
function selectCalDay(dateStr){const today=new Date();today.setHours(0,0,0,0);const target=new Date(dateStr+'T00:00:00');target.setHours(0,0,0,0);dateOffset=Math.round((target-today)/DAY_MS);fetchDay()}
function prevCalMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendar()}
function nextCalMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendar()}
function shiftDate(dir){dateOffset+=dir;fetchDay()}

function setMaster(m){masterMode=m;document.getElementById('tabGemara').classList.toggle('active',m==='gemara');document.getElementById('tabTanya').classList.toggle('active',m==='tanya');document.getElementById('gemaraCustomPicker').classList.toggle('hidden',m!=='gemara');document.getElementById('tanyaCustomPicker').classList.toggle('hidden',m!=='tanya');renderUI()}
function setMode(m){studyMode=m;document.getElementById('btnDaily').classList.toggle('active',m==='daily');document.getElementById('btnCustom').classList.toggle('active',m==='custom');document.getElementById('dailyView').classList.toggle('hidden',m!=='daily');document.getElementById('customView').classList.toggle('hidden',m!=='custom');renderUI()}
function moveDaf(dir){const max=(TRACTATES.find(t=>t.en===customTractateEn)||{daf:64}).daf;if(dir>0){if(customAmud==='a')customAmud='b';else if(customDaf<max){customDaf++;customAmud='a'}}else{if(customAmud==='b')customAmud='a';else if(customDaf>2){customDaf--;customAmud='b'}}buildDafSelect();document.getElementById('customDaf').value=customDaf;document.getElementById('customAmud').value=customAmud}
function moveTanya(dir){const max=(TANYA_SECTIONS.find(s=>s.en===customSectionEn)||{max:53}).max;if(dir>0&&customChapter<max)customChapter++;else if(dir<0&&customChapter>1)customChapter--;document.getElementById('customChapter').value=customChapter}
function onSectionChange(){customSectionEn=document.getElementById('customSection').value;customChapter=1;buildChapterSelect()}
function toggleLearn(){
  const type=masterMode==='gemara'?'gemara':'tanya',was=isLearned(currentGregDate,type),now=!was;
  setLearned(currentGregDate,type,now);
  if(now)learnedDates[currentGregDate+':'+type]=true;else delete learnedDates[currentGregDate+':'+type];
  renderUI();renderCalendar();
}

function getCurrentRef(){
  if(masterMode==='gemara'){
    if(studyMode==='daily')return dailyDafRef?normalizeDafRef(dailyDafRef):null;
    const t=document.getElementById('customTractate').value||customTractateEn,d=parseInt(document.getElementById('customDaf').value,10)||customDaf,a=document.getElementById('customAmud').value||customAmud;
    return buildRef(t,d,a);
  }
  if(studyMode==='daily')return'tanya_daily';
  const sec=document.getElementById('customSection').value||customSectionEn,ch=parseInt(document.getElementById('customChapter').value,10)||customChapter;
  return`tanya_${sec}_${ch}`;
}
function getCurrentTitle(){
  if(masterMode==='gemara'){
    if(studyMode==='daily')return dailyDafHe||dailyDafRef;
    const t=TRACTATES.find(x=>x.en===(document.getElementById('customTractate').value||customTractateEn)),d=parseInt(document.getElementById('customDaf').value,10)||customDaf,a=document.getElementById('customAmud').value||customAmud;
    return`${t?t.he:''} דף ${toGematria(d)} ע${a==='a'?'א':'ב'}`;
  }
  if(studyMode==='daily')return dailyTanyaHe||'תניא יומי';
  const sec=TANYA_SECTIONS.find(s=>s.en===(document.getElementById('customSection').value||customSectionEn)),ch=parseInt(document.getElementById('customChapter').value,10)||customChapter;
  return`תניא - ${sec?sec.he:''} פרק ${toGematria(ch)}`;
}
function enterBeitMidrash(){const ref=getCurrentRef();if(!ref){showError('לא נמצא דף יומי לתאריך הזה. נסה בחירה חופשית.');return}overlayRef=ref;overlayMaster=masterMode;document.getElementById('overlayTitle').textContent=getCurrentTitle();document.getElementById('dafNav').classList.toggle('hidden',masterMode!=='gemara');buildTabs();show('studyOverlay')}
function closeOverlay(){hide('studyOverlay')}

/* ── TABS: reordered – ביאור first, צורת הדף last ── */
const BASE_GEMARA_TABS=[
  {id:'gemara_biur',label:'ביאור',kind:'combo'},
  {id:'rashi',label:'רש״י',kind:'commentary',prefix:'Rashi_on_'},
  {id:'tosafot',label:'תוספות',kind:'commentary',prefix:'Tosafot_on_'},
  {id:'scan',label:'צורת הדף',kind:'scan'}
];
const TABS_TANYA=[{id:'tanya_orig',label:'תניא'},{id:'tanya_explain',label:'ביאור'}];

async function buildTabs(){
  const container=document.getElementById('overlayTabs');
  const tabs=overlayMaster==='gemara'?BASE_GEMARA_TABS:TABS_TANYA;
  dynamicGemaraTabs=tabs;
  container.innerHTML='';
  tabs.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='tab'+(i===0?' active':'');
    btn.textContent=t.label;
    btn.id='tab_'+t.id;
    btn.onclick=()=>switchTab(t.id);
    container.appendChild(btn);
  });
  activeTab=tabs[0].id;
  loadTab(activeTab);
  document.getElementById('notesTa').value=getNote(overlayRef);
}
function switchTab(tabId){activeTab=tabId;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));const btn=document.getElementById('tab_'+tabId);if(btn)btn.classList.add('active');loadTab(tabId)}

async function fetchSefariaData(apiRef){
  const txt=await cachedText(`https://www.sefaria.org/api/texts/${encodeURIComponent(apiRef)}`);
  if(!txt.trim()||txt.trim().startsWith('<'))throw new Error('לא התקבל JSON');
  return JSON.parse(txt);
}
async function fetchSefariaParagraphs(apiRef){
  const data=await fetchSefariaData(apiRef);
  const paragraphs=getHebTextArray(data);
  if(!paragraphs.length)throw new Error('אין תוכן');
  return paragraphs;
}
function renderParagraphs(title,paragraphs){
  return`<div class="gemara-text" dir="rtl"><div class="section-title">${escapeHTML(title)}</div>${paragraphs.map(p=>`<p>${p}</p>`).join('')}</div>`;
}
function renderGemaraWithBiur(gemaraParts,biurParts){
  const max=Math.max(gemaraParts.length,biurParts.length);
  const rows=[];
  for(let i=0;i<max;i++){
    const g=gemaraParts[i]||'';
    const b=biurParts[i]||'';
    rows.push(`<p class="combo-segment">${g?`<span class="combo-label">גמרא</span><span class="combo-gemara">${g}</span>`:''}${b?`<span class="combo-label combo-label-biur">ביאור</span><span class="combo-biur">${b}</span>`:''}</p>`);
  }
  return`<div class="gemara-text gemara-combo" dir="rtl"><div class="section-title">ביאור</div>${rows.join('')}</div>`;
}
async function loadTab(tabId){
  const content=document.getElementById('tabContent');
  if(overlayMaster==='tanya')return loadTanyaTab(tabId,content);
  const tab=(dynamicGemaraTabs||BASE_GEMARA_TABS).find(t=>t.id===tabId)||BASE_GEMARA_TABS[0];
  if(tab.kind==='scan')return loadScan(content);
  content.innerHTML='<div class="loader"><div class="spin"></div><p>טוען...</p></div>';
  const baseRef=normalizeDafRef(overlayRef);
  try{
    if(tab.kind==='combo'){
      const gemaraData=await fetchSefariaData(baseRef);
      const gemara=flattenTextArray(gemaraData.he||gemaraData.text);
      if(!gemara.length)throw new Error('אין גמרא');
      let biur=[];
      try{const biurData=await fetchSefariaData(`Steinsaltz_on_${baseRef}`);biur=flattenTextArray(biurData.he||biurData.text)}catch(e){biur=[]}
      content.innerHTML=biur.length?renderGemaraWithBiur(gemara,biur):renderParagraphs('ביאור',gemara);
      return;
    }
    const apiRef=`${tab.prefix}${baseRef}`;
    const paragraphs=await fetchSefariaParagraphs(apiRef);
    content.innerHTML=renderParagraphs(tab.label,paragraphs);
  }catch(e){
    const label=tab.label||'מקור';
    content.innerHTML=`<div class="portal-card"><div class="portal-box"><div class="portal-mark">${escapeHTML(label.slice(0,2))}</div><div class="portal-title">${escapeHTML(label)}</div><div class="portal-desc">לא נמצא תוכן זמין ללשונית הזאת בדף המבוקש.</div></div></div>`;
  }
}

/* ── SCAN: embed directly via iframe, with fallback link ── */
function loadScan(content){
  const parsed=parseDafRef(overlayRef);
  if(!parsed){
    content.innerHTML=`<div class="portal-card"><div class="portal-box"><div class="portal-mark">דף</div><div class="portal-title">לא זוהה דף</div><div class="portal-desc">לא הצלחתי לזהות את הדף הנבחר.</div></div></div>`;
    return;
  }
  const t=TRACTATES.find(x=>x.en===parsed.tractateEn);
  const dafLabel=`${t?t.he:parsed.tractateEn} דף ${toGematria(parsed.daf)} ע${parsed.amud==='a'?'א':'ב'}`;
  const portalUrl=getDafYomiPortalUrl(parsed.tractateEn,parsed.daf,parsed.amud);

  content.innerHTML=`
    <div style="text-align:center;padding:8px 0 4px">
      <div class="section-title">צורת הדף — ${escapeHTML(dafLabel)}</div>
    </div>
    <div style="text-align:center">
      <button class="scan-fs-btn" onclick="openScanFullscreen('${portalUrl}','${escapeHTML(dafLabel).replace(/'/g,"\\'")}')">⛶ פתח במסך מלא</button>
    </div>
    <div class="scan-frame">
      <iframe src="${portalUrl}" title="צורת הדף" loading="lazy"></iframe>
    </div>
    <div class="scan-fallback">
      אם הדף לא נטען — <a href="${portalUrl}" target="_blank" rel="noopener">פתח בחלון חדש</a>
    </div>`;
}
function openScanFullscreen(url,label){
  let fs=document.getElementById('scanFullscreen');
  if(!fs){
    fs=document.createElement('div');
    fs.id='scanFullscreen';
    fs.className='scan-fullscreen';
    document.body.appendChild(fs);
  }
  fs.innerHTML=`
    <div class="scan-fs-bar">
      <div class="scan-zoom">
        <button onclick="scanZoom(-1)" aria-label="הקטן">−</button>
        <span class="zlabel" id="scanZoomLabel">100%</span>
        <button onclick="scanZoom(1)" aria-label="הגדל">+</button>
      </div>
      <div class="scan-fs-title">${label}</div>
      <button class="scan-fs-close" onclick="closeScanFullscreen()">סגור ✕</button>
    </div>
    <div class="scan-fs-scroll" id="scanScroll">
      <div class="scan-fs-inner" id="scanInner">
        <iframe src="${url}" title="צורת הדף"></iframe>
      </div>
    </div>`;
  fs.style.display='flex';
  window._scanScale=1;
  applyScanScale();
  setupPinch();
}
function applyScanScale(){
  const inner=document.getElementById('scanInner');
  const label=document.getElementById('scanZoomLabel');
  if(!inner)return;
  inner.style.transform=`scale(${window._scanScale})`;
  inner.style.width=(100/window._scanScale)+'%';
  if(label)label.textContent=Math.round(window._scanScale*100)+'%';
}
function scanZoom(dir){
  window._scanScale=Math.min(4,Math.max(.5,(window._scanScale||1)+dir*0.25));
  applyScanScale();
}
function setupPinch(){
  const scroll=document.getElementById('scanScroll');
  if(!scroll)return;
  let startDist=0,startScale=1;
  scroll.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      startScale=window._scanScale||1;
    }
  },{passive:true});
  scroll.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&startDist){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      window._scanScale=Math.min(4,Math.max(.5,startScale*(d/startDist)));
      applyScanScale();
    }
  },{passive:true});
  scroll.addEventListener('touchend',e=>{if(e.touches.length<2)startDist=0},{passive:true});
}
function closeScanFullscreen(){
  const fs=document.getElementById('scanFullscreen');
  if(fs){fs.style.display='none';fs.innerHTML=''}
}

async function loadTanyaTab(tabId,content){
  const isDaily=overlayRef==='tanya_daily';
  const ref=isDaily?null:tanyaRef(customSectionEn,customChapter);
  if(tabId==='tanya_orig'&&ref){
    content.innerHTML='<div class="loader"><div class="spin"></div><p>טוען...</p></div>';
    try{const paragraphs=await fetchSefariaParagraphs(ref);content.innerHTML=renderParagraphs('תניא',paragraphs);return}catch(e){}
  }
  const url=isDaily?'https://he.chabad.org/dailystudy/tanya.htm':`https://www.sefaria.org/${encodeURIComponent(ref)}?lang=he`;
  const title=isDaily?'תניא יומי':'תניא לפי הפרק הנבחר';
  const desc=isDaily?'פתח את הלימוד היומי המלא באתר חב״ד.':'הקישור נפתח לפרק שבחרת, ולא לדף היומי הכללי.';
  content.innerHTML=`<div class="portal-card"><div class="portal-box"><div class="portal-mark">ת</div><div class="portal-title">${title}</div><div class="portal-desc">${desc}</div><a href="${url}" target="_blank" rel="noopener" class="portal-btn">פתח מקור</a></div></div>`;
}
function navigateDaf(dir){if(overlayMaster!=='gemara')return;overlayRef=getAdjacentRef(overlayRef,dir);const parsed=parseDafRef(overlayRef);if(parsed){const t=TRACTATES.find(x=>x.en===parsed.tractateEn);document.getElementById('overlayTitle').textContent=`${t?t.he:parsed.tractateEn} דף ${toGematria(parsed.daf)} ע${parsed.amud==='a'?'א':'ב'}`}buildTabs()}
function toggleNotes(){document.getElementById('notesArea').classList.toggle('hidden')}
function saveNote(){saveNoteVal(overlayRef,document.getElementById('notesTa').value)}

function showHistory(){const container=document.getElementById('histContent'),entries=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('learned_')&&localStorage.getItem(k)==='1'){const parts=k.split('_');if(parts.length>=3)entries.push({type:parts[1],dateKey:parts.slice(2).join('_')})}}}catch(e){}entries.sort((a,b)=>b.dateKey.localeCompare(a.dateKey));if(!entries.length){container.innerHTML='<div style="text-align:center;color:var(--muted);padding:30px;font-size:16px;font-weight:700">עדיין לא סימנת לימודים</div>'}else{container.innerHTML=entries.map(e=>`<div class="hist-row"><strong>${e.dateKey}</strong><span class="${e.type==='gemara'?'hist-g':'hist-t'}">${e.type==='gemara'?'גמרא':'תניא'} ✓</span></div>`).join('')}show('histModal')}
function closeHistory(){hide('histModal')}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showError(msg){const b=document.getElementById('errorBox');b.textContent=msg;b.classList.remove('hidden')}
</script>
