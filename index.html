<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>בית המדרש הדיגיטלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff7ef;
  --card:#ffffff;
  --card2:#fff1e3;
  --ink:#241015;
  --muted:#8b6f6c;
  --line:#f0d8c7;
  --navy:#6d1d2b;
  --navy2:#a43a4f;
  --gold:#ffb84d;
  --gold2:#ffe1a6;
  --green:#2f8f6b;
  --blue:#b64662;
  --red:#d94b4b;
  --shadow:0 28px 80px rgba(109,29,43,.18);
  --soft:0 14px 38px rgba(109,29,43,.12);
  --r:30px;
}
html,body{min-height:100%}
body{
  min-height:100vh;
  direction:rtl;
  color:var(--ink);
  font-family:'Assistant',sans-serif;
  text-align:center;
  background:
    radial-gradient(circle at 50% -5%,rgba(255,184,77,.32),transparent 38%),
    radial-gradient(circle at 14% 22%,rgba(164,58,79,.18),transparent 30%),
    radial-gradient(circle at 88% 72%,rgba(255,143,97,.16),transparent 32%),
    linear-gradient(180deg,#fff9f2 0%,#fff0e5 100%);
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(109,29,43,.08) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,black,transparent 78%);
}
button,select,textarea{font-family:inherit}
button{border:0;cursor:pointer}
#app{
  position:relative;z-index:1;
  width:min(100%,520px);
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:18px 14px;
}
.app-shell{
  width:100%;
  min-height:calc(100vh - 36px);
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  border:1px solid rgba(214,178,94,.35);
  border-radius:36px;
  background:rgba(255,255,255,.82);
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
}
.hero{
  position:relative;overflow:hidden;
  width:100%;
  padding:26px 18px 18px;
  color:white;
  background:linear-gradient(145deg,#6d1d2b 0%,#a43a4f 58%,#c65a45 100%);
  border-bottom:3px solid var(--gold);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.hero:before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:310px;height:310px;border-radius:999px;background:radial-gradient(circle,rgba(241,215,138,.30),transparent 68%)}
.topbar{position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
.brand{text-align:center;line-height:1.08}.brand strong{display:block;font-family:'Assistant',sans-serif;font-size:30px;font-weight:900;color:var(--gold2);letter-spacing:.01em}.brand span{display:block;margin-top:6px;font-size:14px;color:rgba(255,255,255,.75)}
.streak{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:92px;height:40px;background:rgba(255,255,255,.11);border:1px solid rgba(241,215,138,.42);border-radius:999px;color:var(--gold2);font-weight:900;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.streak svg{width:18px;height:18px;fill:currentColor}
.mode-tabs{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:7px;border-radius:22px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16)}
.mode-tab{height:44px;border-radius:16px;background:transparent;color:rgba(255,255,255,.72);font-size:16px;font-weight:900;transition:.18s;text-align:center}.mode-tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);box-shadow:0 10px 22px rgba(214,178,94,.24)}.mode-tab.history{padding:0;color:rgba(255,255,255,.82);border:1px solid rgba(241,215,138,.20)}
.today-panel{position:relative;z-index:1;width:100%;max-width:430px;margin:16px auto 0;padding:16px;border-radius:26px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);text-align:center}
.date-line{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}.date-nav-btn{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.12);color:white;font-size:22px}.date-center{text-align:center;min-width:0}.date-center .hdate{font-family:'Assistant',sans-serif;color:#fff;font-size:20px;font-weight:900}.date-center .gdate{font-size:13px;color:rgba(255,255,255,.68);margin-top:3px}.calendar-toggle{margin:14px auto 0;width:100%;max-width:260px;height:40px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:var(--gold2);font-weight:900;font-size:14px;text-align:center}
.main{width:100%;max-width:430px;flex:1;padding:18px 14px 22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;text-align:center}.hidden{display:none!important}.fade{animation:fade .24s ease-out}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.full-loader,.loader{width:100%;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:36px;color:var(--muted);font-weight:900;text-align:center}.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#mainBody{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.study-card{width:100%;background:var(--card);border:1px solid rgba(214,178,94,.35);border-radius:30px;box-shadow:var(--soft);overflow:hidden;text-align:center}.study-card-header{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:16px;background:linear-gradient(180deg,#fff8ef,#fff0e3);border-bottom:1px solid var(--line);text-align:center}.study-card-label{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.10em}.badges{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.badge{font-size:12px;padding:5px 12px;border-radius:999px;font-weight:900}.badge-gemara{background:rgba(164,58,79,.13);color:var(--blue)}.badge-tanya{background:rgba(36,115,77,.12);color:var(--green)}.badge-daily{background:rgba(214,178,94,.18);color:#73540d}.badge-custom{background:rgba(109,29,43,.10);color:var(--navy2)}.study-card-body{padding:18px;text-align:center}.study-mode-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff0e5;border:1px solid var(--line);border-radius:18px;padding:5px;margin:0 auto 16px;max-width:360px}.study-mode-btn{height:42px;border-radius:14px;background:transparent;color:var(--muted);font-size:15px;font-weight:900;text-align:center}.study-mode-btn.active{background:white;color:var(--ink);box-shadow:0 8px 18px rgba(109,29,43,.08)}
.daily-block{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(180deg,#fff,#fff5ec);border:1px solid var(--line);padding:24px 18px;text-align:center}.daily-title{font-family:'Assistant',sans-serif;font-size:34px;line-height:1.18;font-weight:900;color:var(--ink);margin:0 auto 9px;text-align:center}.daily-subtitle{font-size:14px;color:var(--muted);font-weight:800;min-height:20px;text-align:center}.quick-actions{display:grid;grid-template-columns:1fr;gap:10px;margin:18px auto 0;max-width:310px}.learn-btn,.open-btn{width:100%;height:50px;border-radius:18px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}.learn-btn.idle{background:linear-gradient(135deg,#6d1d2b,#a43a4f);color:#fff4d6}.learn-btn.done{background:var(--green);color:white}.open-btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);box-shadow:0 10px 22px rgba(214,178,94,.24)}
.picker-row{display:flex;justify-content:center;align-items:center;gap:8px}.picker-btn{width:44px;height:44px;background:white;border:1px solid var(--line);border-radius:16px;color:var(--navy2);font-size:18px;font-weight:900}.picker-select{width:100%;height:46px;background:white;border:1.5px solid var(--line);border-radius:16px;padding:0 12px;color:var(--ink);font-size:15px;font-weight:900;outline:none;text-align:center;text-align-last:center;appearance:none}.picker-select:focus{border-color:var(--gold)}
.enter-btn{width:100%;max-width:340px;height:60px;border-radius:22px;background:linear-gradient(135deg,#6d1d2b,#a43a4f,#c65a45);color:var(--gold2);font-size:20px;font-family:'Assistant',sans-serif;font-weight:900;box-shadow:0 14px 30px rgba(109,29,43,.24);text-align:center}.enter-btn:active,.open-btn:active,.learn-btn:active{transform:scale(.985)}
.error-box{width:100%;background:#fff8e5;border:1px solid #ead69a;border-radius:18px;padding:13px 15px;color:#765400;font-size:13px;line-height:1.6;font-weight:900;text-align:center}
.cal-drawer{width:calc(100% - 28px);max-width:430px;margin:0 auto 16px;border-radius:28px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--soft);text-align:center}.cal-head{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;padding:14px;background:linear-gradient(180deg,#fff8ef,#fff0e3);border-bottom:1px solid var(--line)}.month-nav{width:42px;height:42px;border-radius:15px;background:white;border:1px solid var(--line);font-size:18px;color:var(--ink);text-align:center}.cal-title{text-align:center;font-weight:900;font-family:'Assistant',sans-serif}.cal-title span{display:block;font-family:'Assistant';font-size:12px;font-weight:800;color:var(--muted);margin-top:2px}.cal-weekdays,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-wd{text-align:center;padding:9px 0 5px;font-size:11px;color:var(--muted);font-weight:900}.cal-grid{padding:7px 9px 12px}.cal-cell{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;text-align:center}.cal-cell:not(.empty):hover{background:#fff0e5}.cal-cell.empty{opacity:0}.cal-cell.today{background:var(--navy);color:white}.cal-cell.selected:not(.today):not(.learned){outline:2px solid var(--gold);background:rgba(214,178,94,.15)}.cal-cell.learned{background:var(--green);color:white}.cal-cell.learned:after{content:"✓";position:absolute;left:5px;top:3px;font-size:10px;font-weight:900}.cal-cell.shabbat:not(.today):not(.learned){color:var(--red)}.hday{font-size:10px;color:currentColor;opacity:.68;font-family:'Assistant';text-align:center}.gday{font-size:14px;font-weight:900;color:currentColor;text-align:center}
.overlay,.hist-modal{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;animation:slideUp .25s ease-out;text-align:center}@keyframes slideUp{from{transform:translateY(100%);opacity:.8}to{transform:none;opacity:1}}.overlay-header,.hist-header{width:100%;background:linear-gradient(145deg,var(--navy),var(--navy2));padding:18px 14px 0;border-bottom:3px solid var(--gold);color:white;text-align:center}.overlay-top,.hist-top{width:100%;max-width:560px;margin:0 auto 13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.overlay-title,.hist-title{max-width:100%;font-family:'Assistant',sans-serif;font-size:21px;font-weight:900;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.overlay-actions{display:flex;justify-content:center;align-items:center;gap:8px;flex-shrink:0}.small-dark{height:38px;padding:0 15px;border-radius:14px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);color:white;font-weight:900;text-align:center}.notes-btn{color:var(--gold2)}.daf-nav{width:100%;max-width:430px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:13px}.daf-nav-btn{height:43px;border-radius:15px;background:rgba(255,255,255,.09);border:1px solid rgba(241,215,138,.25);color:var(--gold2);font-size:15px;font-weight:900;text-align:center}.tabs{width:100%;display:flex;justify-content:center;background:white;border-bottom:1px solid var(--line);overflow-x:auto}.tab{flex:1;min-width:82px;max-width:140px;height:46px;background:white;color:#777f90;border-bottom:3px solid transparent;font-size:14px;font-weight:900;text-align:center}.tab.active{color:var(--ink);border-bottom-color:var(--gold)}.tab-content{width:100%;max-width:760px;flex:1;overflow-y:auto;padding:18px;text-align:center}.gemara-text{font-family:'Assistant',sans-serif;font-size:20px;line-height:2.05;color:var(--ink);text-align:center}.gemara-text p{background:white;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:22px;padding:18px;margin:0 auto 16px;max-width:680px;text-align:center}.gemara-text b{font-weight:900;color:var(--ink)}.section-title{display:inline-flex;align-items:center;justify-content:center;margin:0 auto 14px;padding:8px 18px;border-radius:999px;background:#fff2c9;color:var(--ink);font-size:16px;font-weight:900;border:1px solid var(--gold)}.portal-card{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:62vh}.portal-box{width:100%;max-width:420px;background:white;border:1px solid var(--line);border-radius:30px;padding:28px 22px;box-shadow:var(--soft);text-align:center}.portal-mark{width:58px;height:58px;border-radius:21px;margin:0 auto 14px;background:linear-gradient(135deg,#6d1d2b,#a43a4f,#c65a45);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-family:'Assistant';font-weight:900;font-size:24px}.portal-title{font-family:'Assistant',sans-serif;font-size:26px;font-weight:900;margin-bottom:9px;text-align:center}.portal-desc{font-size:15px;color:var(--muted);line-height:1.7;font-weight:800;text-align:center}.portal-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;height:53px;border-radius:19px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--ink);font-family:'Assistant';font-size:18px;font-weight:900;margin:16px auto 0;text-align:center}.portal-secondary{background:linear-gradient(135deg,#6d1d2b,#a43a4f);color:#fff4d6;margin-top:9px}.notes-area{width:100%;padding:13px 14px;background:#fff8e5;border-bottom:1px solid #ead69a;text-align:center}.notes-label{font-size:13px;color:#765400;font-weight:900;margin-bottom:7px;text-align:center}.notes-ta{width:100%;max-width:560px;min-height:98px;resize:vertical;background:white;border:1px solid #ead69a;border-radius:17px;padding:12px;color:var(--ink);font-size:16px;line-height:1.6;outline:none;text-align:center}.hist-header{padding:20px 16px}.hist-content{width:100%;max-width:520px;flex:1;overflow:auto;padding:18px;text-align:center}.hist-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:white;border:1px solid var(--line);border-radius:20px;padding:15px;margin:0 auto 10px;text-align:center}.hist-row strong{font-family:'Assistant';font-size:16px}.hist-row span{font-size:12px;font-weight:900;border-radius:999px;padding:5px 12px}.hist-g{background:rgba(164,58,79,.13);color:var(--blue)}.hist-t{background:rgba(36,115,77,.12);color:var(--green)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#e8c1b3;border-radius:99px}
@media (max-width:390px){#app{padding:0}.app-shell{border-radius:0;min-height:100vh}.brand strong{font-size:27px}.daily-title{font-size:29px}.mode-tab{font-size:15px}.quick-actions{max-width:none}}

/* young warm theme override */
.brand strong{font-size:32px;letter-spacing:-.04em;color:#fff4d6;text-shadow:0 10px 26px rgba(0,0,0,.18)}
.brand span{font-family:'Assistant',sans-serif;font-weight:700;color:rgba(255,255,255,.82)}
.hero{border-bottom:0;border-radius:0 0 34px 34px;box-shadow:0 20px 50px rgba(109,29,43,.18)}
.hero:after{content:"";position:absolute;inset:auto -40px -90px -40px;height:160px;background:radial-gradient(closest-side,rgba(255,225,166,.28),transparent);pointer-events:none}
.app-shell{background:rgba(255,250,245,.88);border-color:rgba(255,184,77,.34)}
.study-card,.cal-drawer,.portal-box{border-color:rgba(255,184,77,.36)}
.daily-title{letter-spacing:-.05em;color:#331018}
.open-btn,.mode-tab.active,.portal-btn{background:linear-gradient(135deg,#ffb84d 0%,#ffda7a 48%,#fff0b8 100%);box-shadow:0 14px 28px rgba(255,184,77,.28)}
.enter-btn{background:linear-gradient(135deg,#6d1d2b 0%,#a43a4f 54%,#c65a45 100%);color:#fff4d6}
.learn-btn.done{background:linear-gradient(135deg,#2f8f6b,#43b883)}
.tab.active{color:#6d1d2b;border-bottom-color:#ffb84d;background:#fff7ef}
.gemara-text p{border-top-color:#ffb84d}
.portal-mark{background:linear-gradient(135deg,#6d1d2b,#a43a4f,#c65a45);color:#fff4d6}

</style>
</head>
<body>
<div id="app">
  <div class="app-shell">
    <header class="hero">
      <div class="topbar">
        <div class="brand"><strong>בית המדרש</strong><span>הלימוד היומי שלך, נקי ומהיר</span></div>
        <div id="streakBadge" class="streak" title="רצף לימוד">
          <svg viewBox="0 0 24 24"><path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14zm0 17a3 3 0 0 1-3-3c0-3 3-4 3-7 0 3 3 4 3 7a3 3 0 0 1-3 3z"/></svg>
          <span id="streakNum">0</span>
        </div>
      </div>
      <nav class="mode-tabs">
        <button class="mode-tab active" id="tabGemara" onclick="setMaster('gemara')">גמרא</button>
        <button class="mode-tab" id="tabTanya" onclick="setMaster('tanya')">תניא</button>
        <button class="mode-tab history" id="tabHistory" onclick="showHistory()">היסטוריה</button>
      </nav>
      <section class="today-panel">
        <div class="date-line">
          <button class="date-nav-btn" onclick="shiftDate(1)" aria-label="היום הבא">‹</button>
          <div class="date-center">
            <div class="hdate" id="hebDateDisplay">טוען...</div>
            <div class="gdate" id="gregDateDisplay"></div>
          </div>
          <button class="date-nav-btn" onclick="shiftDate(-1)" aria-label="היום הקודם">›</button>
        </div>
        <button class="calendar-toggle" onclick="toggleCalendar()" id="calendarToggle">פתח לוח חודשי</button>
      </section>
    </header>

    <section id="calContainer" class="cal-drawer hidden">
      <div class="cal-head">
        <button class="month-nav" onclick="prevCalMonth()">›</button>
        <div class="cal-title"><div id="calMonthTitle">טוען...</div><span id="calGregSub"></span></div>
        <button class="month-nav" onclick="nextCalMonth()">‹</button>
      </div>
      <div class="cal-weekdays"><div class="cal-wd">א</div><div class="cal-wd">ב</div><div class="cal-wd">ג</div><div class="cal-wd">ד</div><div class="cal-wd">ה</div><div class="cal-wd">ו</div><div class="cal-wd">ש</div></div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <main class="main" id="mainContent">
      <div class="full-loader" id="mainLoader"><div class="spin"></div><p>טוען לימוד יומי...</p></div>
      <div id="mainBody" class="hidden fade">
        <div id="errorBox" class="error-box hidden"></div>
        <section class="study-card">
          <div class="study-card-header">
            <div class="study-card-label" id="studyCardLabel">לימוד היום</div>
            <div class="badges"><span id="masterBadge" class="badge badge-gemara">גמרא</span><span id="modeBadge" class="badge badge-daily">יומי</span></div>
          </div>
          <div class="study-card-body">
            <div class="study-mode-row">
              <button class="study-mode-btn active" id="btnDaily" onclick="setMode('daily')">לימוד יומי</button>
              <button class="study-mode-btn" id="btnCustom" onclick="setMode('custom')">בחירה חופשית</button>
            </div>
            <div id="dailyView" class="daily-block">
              <div class="daily-title" id="dailyTitle">-</div>
              <div class="daily-subtitle" id="dailySubtitle"></div>
              <div class="quick-actions">
                <button class="open-btn" onclick="enterBeitMidrash()">פתח לימוד</button>
                <button class="learn-btn idle" id="learnBtn" onclick="toggleLearn()"><span id="learnBtnText">סמן כנלמד</span></button>
              </div>
            </div>
            <div id="customView" class="hidden">
              <div id="gemaraCustomPicker">
                <select class="picker-select" id="customTractate" style="margin-bottom:9px"></select>
                <div class="picker-row">
                  <button class="picker-btn" onclick="moveDaf(-1)">‹</button>
                  <select class="picker-select" id="customDaf"></select>
                  <select class="picker-select" id="customAmud" style="max-width:96px"><option value="a">עמוד א'</option><option value="b">עמוד ב'</option></select>
                  <button class="picker-btn" onclick="moveDaf(1)">›</button>
                </div>
              </div>
              <div id="tanyaCustomPicker" class="hidden">
                <select class="picker-select" id="customSection" style="margin-bottom:9px" onchange="onSectionChange()"></select>
                <div class="picker-row"><button class="picker-btn" onclick="moveTanya(-1)">‹</button><select class="picker-select" id="customChapter"></select><button class="picker-btn" onclick="moveTanya(1)">›</button></div>
              </div>

// STORAGE + CACHE
function ls(k,def=''){try{return localStorage.getItem(k)||def}catch(e){return def}}
function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsr(k){try{localStorage.removeItem(k)}catch(e){}}
function isLearned(dateKey,type){return ls(`learned_${type}_${dateKey}`)==='1'}
function setLearned(dateKey,type,v){v?lss(`learned_${type}_${dateKey}`,'1'):lsr(`learned_${type}_${dateKey}`)}
function getNote(ref){return ls(`note_${ref}`,'')}
function saveNoteVal(ref,v){lss(`note_${ref}`,v)}
function cacheKey(url){return 'cache_v2_'+url}
async function cachedJSON(url,ttl=CACHE_TTL){
  const key=cacheKey(url);
  try{const raw=localStorage.getItem(key);if(raw){const obj=JSON.parse(raw);if(Date.now()-obj.t<ttl)return obj.v}}catch(e){}
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const val=await res.json();
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),v:val}))}catch(e){}
  return val;
}
async function cachedText(url,ttl=CACHE_TTL){
  const key=cacheKey('text_'+url);
  try{const raw=localStorage.getItem(key);if(raw){const obj=JSON.parse(raw);if(Date.now()-obj.t<ttl)return obj.v}}catch(e){}
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const val=await res.text();
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),v:val}))}catch(e){}
  return val;
}

// DATE + REF HELPERS
function dateKeyFromDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDaysKey(key,delta){const d=new Date(key+'T00:00:00');d.setDate(d.getDate()+delta);return dateKeyFromDate(d)}
function todayKey(){const d=new Date();return dateKeyFromDate(d)}
function calcStreak(type){
  let anchor=todayKey();
  if(!isLearned(anchor,type) && isLearned(addDaysKey(anchor,-1),type)) anchor=addDaysKey(anchor,-1);
  let count=0,cur=anchor;
  while(isLearned(cur,type)){count++;cur=addDaysKey(cur,-1)}
  return count;
}
function getDafYomiId(tractateEn,daf,amud){const start=TRACTATE_ID_STARTS[tractateEn];if(!start||daf<2)return null;return start+(daf-2)*2+(amud==='b'?1:0)}
function getDafYomiUrl(tractateEn,daf,amud){
  const id=getDafYomiId(tractateEn,daf,amud||'a');
  return id?`https://daf-yomi.com/DafYomi_Page.aspx?vt=1&id=${id}`:'https://daf-yomi.com/';
}
function getDafYomiPortalUrl(tractateEn,daf,amud){
  return getDafYomiUrl(tractateEn,daf,amud);
}
function normalizeDafRef(ref){
  if(!ref)return '';
  let s=String(ref).trim()
    .replace(/^https?:\/\/www\.sefaria\.org\//,'')
    .replace(/^https?:\/\/sefaria\.org\//,'')
    .replace(/^\/+/,'')
    .replace(/\?.*$/,'')
    .replace(/\//g,'.')
    .replace(/_/g,' ')
    .trim();
  let m=s.match(/^(.+?)[\s.]+(\d+)(a|b)$/i);
  if(m)return `${m[1].trim().replace(/ /g,'_')}.${parseInt(m[2],10)}${m[3].toLowerCase()}`;
  m=s.match(/^(.+?)[\s.]+(\d+)$/i);
  if(m)return `${m[1].trim().replace(/ /g,'_')}.${parseInt(m[2],10)}a`;
  return s.replace(/ /g,'_');
}
function parseDafRef(ref){
  const s=normalizeDafRef(ref).replace(/_/g,' ');
  const m=s.match(/^(.+?)\.(\d+)(a|b)$/i);
  if(!m)return null;
  return {tractateEn:m[1].replace(/ /g,'_'),daf:parseInt(m[2],10),amud:m[3].toLowerCase()};
}
function buildRef(tractateEn,daf,amud){return `${tractateEn}.${daf}${amud}`}
function getAdjacentRef(ref,dir){const p=parseDafRef(ref);if(!p)return ref;const idx=TRACTATES.findIndex(t=>t.en===p.tractateEn);if(idx<0)return ref;let{tractateEn,daf,amud}=p;const maxDaf=TRACTATES[idx].daf;if(dir>0){if(amud==='a')amud='b';else if(daf<maxDaf){daf++;amud='a'}else if(TRACTATES[idx+1]){tractateEn=TRACTATES[idx+1].en;daf=2;amud='a'}}else{if(amud==='b')amud='a';else if(daf>2){daf--;amud='b'}else if(idx>0){tractateEn=TRACTATES[idx-1].en;daf=TRACTATES[idx-1].daf;amud='b'}}return buildRef(tractateEn,daf,amud)}
function toGematria(n){if(!n||n<=0)return'';const U=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],T=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],H=['','ק','ר','ש','ת'];const h=Math.floor(n/100),t=Math.floor((n%100)/10),u=n%10;let s=H[h]||'';if(t===1&&u===5)s+='טו';else if(t===1&&u===6)s+='טז';else s+=(T[t]||'')+(U[u]||'');return s}
function tanyaRef(sectionEn,chapter){const sec=TANYA_SECTIONS.find(s=>s.en===sectionEn)||TANYA_SECTIONS[0];return `${sec.sefaria}.${chapter}`}
function tanyaUrlForCurrent(){
  if(studyMode==='daily')return 'https://he.chabad.org/dailystudy/tanya.htm';
  return `https://www.sefaria.org/${encodeURIComponent(tanyaRef(customSectionEn,customChapter))}?lang=he`;
}
function getHebTextArray(data){
  const candidates=[data && data.he, data && data.text, data && data.heRefText];
  for(const c of candidates){const arr=Array.isArray(c)?c.flat(Infinity):[c];const out=arr.filter(x=>typeof x==='string'&&x.trim());if(out.length)return out}
  return [];
}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}

// INIT
window.addEventListener('DOMContentLoaded',()=>{buildTractateSelect();buildDafSelect();buildSectionSelect();buildChapterSelect();loadLearnedDates();fetchDay()});
function loadLearnedDates(){learnedDates={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('learned_')&&localStorage.getItem(k)==='1'){const parts=k.split('_');if(parts.length>=3){const type=parts[1],dateKey=parts.slice(2).join('_');learnedDates[dateKey+':'+type]=true}}}}catch(e){}}
function buildTractateSelect(){const sel=document.getElementById('customTractate');sel.innerHTML='';TRACTATES.forEach(t=>{const o=document.createElement('option');o.value=t.en;o.textContent=t.he;sel.appendChild(o)});sel.onchange=e=>{customTractateEn=e.target.value;customDaf=2;customAmud='a';buildDafSelect()}}
function buildDafSelect(){const t=TRACTATES.find(x=>x.en===customTractateEn),max=t?t.daf:64,sel=document.getElementById('customDaf');sel.innerHTML='';for(let i=2;i<=max;i++){const o=document.createElement('option');o.value=i;o.textContent=`דף ${toGematria(i)}`;sel.appendChild(o)}if(customDaf>max)customDaf=2;sel.value=customDaf;sel.onchange=e=>{customDaf=parseInt(e.target.value,10)}}
function buildSectionSelect(){const sel=document.getElementById('customSection');sel.innerHTML='';TANYA_SECTIONS.forEach(s=>{const o=document.createElement('option');o.value=s.en;o.textContent=s.he;sel.appendChild(o)});sel.onchange=e=>{customSectionEn=e.target.value;customChapter=1;buildChapterSelect()}}

// DAILY LOAD
async function fetchDay(){
  show('mainLoader');hide('mainBody');hide('errorBox');
  const d=new Date();d.setDate(d.getDate()+dateOffset);
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  currentGregDate=dateKeyFromDate(d);
  document.getElementById('gregDateDisplay').textContent=d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  dailyDafRef='';dailyDafHe='';dailyTanyaHe='';
  try{
    const data=await cachedJSON(`https://www.sefaria.org/api/calendars?year=${y}&month=${m}&day=${day}`);
    if(data.calendar_items){
      const dafItem=data.calendar_items.find(c=>c.title&&c.title.en==='Daf Yomi');
      const tanyaItem=data.calendar_items.find(c=>c.title&&c.title.en==='Tanya Yomi');
      if(dafItem){dailyDafRef=normalizeDafRef(dafItem.url||dafItem.ref||dafItem.displayValue?.en||'');dailyDafHe=dafItem.displayValue&&dafItem.displayValue.he?dafItem.displayValue.he:(dafItem.ref||'דף יומי')}
      if(tanyaItem){dailyTanyaHe=tanyaItem.displayValue&&tanyaItem.displayValue.he?`תניא - ${tanyaItem.displayValue.he}`:'תניא יומי'}
    }
  }catch(e){showError('לא הצלחתי לטעון את הלימוד היומי מספריא. אפשר לבחור ידנית ב״בחירה חופשית״.')}
  try{
    const hdata=await cachedJSON(`https://www.hebcal.com/converter?cfg=json&date=${currentGregDate}&g2h=1&strict=1`);
    currentHebDate=hdata.hebrew?hdata.hebrew.replace(/[\u0591-\u05C7]/g,''):'';
    document.getElementById('hebDateDisplay').textContent=currentHebDate||d.toLocaleDateString('he-IL');
  }catch(e){document.getElementById('hebDateDisplay').textContent=d.toLocaleDateString('he-IL')}
  calYear=d.getFullYear();calMonth=d.getMonth();renderUI();renderCalendar();hide('mainLoader');show('mainBody');document.getElementById('mainBody').classList.add('fade')
}
function renderUI(){
  const type=masterMode==='gemara'?'gemara':'tanya',learned=isLearned(currentGregDate,type);
  document.getElementById('streakNum').textContent=calcStreak(type);
  document.getElementById('masterBadge').textContent=masterMode==='gemara'?'גמרא':'תניא';
  document.getElementById('masterBadge').className='badge '+(masterMode==='gemara'?'badge-gemara':'badge-tanya');
  document.getElementById('modeBadge').textContent=studyMode==='daily'?'יומי':'אישי';
  document.getElementById('modeBadge').className='badge '+(studyMode==='daily'?'badge-daily':'badge-custom');
  if(studyMode==='daily'){
    const title=masterMode==='gemara'?dailyDafHe:dailyTanyaHe;
    document.getElementById('dailyTitle').textContent=title||'אין נתונים';
    document.getElementById('dailySubtitle').textContent=masterMode==='gemara'&&dailyDafRef?dailyDafRef.replace(/_/g,' '):'הלימוד נמשך לפי התאריך שבחרת';
  }
  const btn=document.getElementById('learnBtn'),txt=document.getElementById('learnBtnText');
  btn.className='learn-btn '+(learned?'done':'idle');
  txt.textContent=learned?'נלמד':'סמן כנלמד';
}

// EXACT HEBREW CALENDAR
async function getHebrewMonthData(year,month){
  const totalDays=new Date(year,month+1,0).getDate();
  const cache=`month_${year}_${month}`;
  if(calData[cache])return calData[cache];
  const promises=[];
  for(let dd=1;dd<=totalDays;dd++){
    const key=`${year}-${String(month+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    promises.push(cachedJSON(`https://www.hebcal.com/converter?cfg=json&date=${key}&g2h=1&strict=1`).then(j=>({day:dd,hd:j.hd,hm:j.hm,hy:j.hy,hebrew:j.hebrew})).catch(()=>({day:dd,hd:dd,hm:'',hy:''})));
  }
  const rows=await Promise.all(promises);
  const obj={days:{},title:''};
  rows.forEach(r=>{obj.days[r.day]=r});
  const first=rows[0],last=rows[rows.length-1],mid=rows[Math.min(14,rows.length-1)];
  obj.title=first.hm&&last.hm&&first.hm!==last.hm?`${first.hm} / ${last.hm} ${last.hy||first.hy||''}`:`${(mid.hm||first.hm||'').trim()} ${(mid.hy||first.hy||'').toString()}`.trim();
  calData[cache]=obj;
  return obj;
}
async function renderCalendar(){
  const d1=new Date(calYear,calMonth,1),totalDays=new Date(calYear,calMonth+1,0).getDate(),startDow=d1.getDay(),grid=document.getElementById('calGrid');
  document.getElementById('calGregSub').textContent=`${GREG_MONTHS_HE[calMonth]} ${calYear}`;
  grid.innerHTML='';
  let monthData={days:{},title:`${GREG_MONTHS_HE[calMonth]} ${calYear}`};
  try{monthData=await getHebrewMonthData(calYear,calMonth)}catch(e){}
  document.getElementById('calMonthTitle').textContent=monthData.title||`${GREG_MONTHS_HE[calMonth]} ${calYear}`;
  for(let i=0;i<startDow;i++){const blank=document.createElement('div');blank.className='cal-cell empty';grid.appendChild(blank)}
  const todayStr=todayKey();
  for(let dd=1;dd<=totalDays;dd++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`,cell=document.createElement('div'),dow=(startDow+dd-1)%7;
    cell.className='cal-cell';
    if(dow===6)cell.classList.add('shabbat');
    if(dateStr===todayStr)cell.classList.add('today');
    if(dateStr===currentGregDate)cell.classList.add('selected');
    if(isLearned(dateStr,'gemara')||isLearned(dateStr,'tanya'))cell.classList.add('learned');
    const h=monthData.days[dd]||{};
    cell.innerHTML=`<span class="hday">${toGematria(h.hd||dd)}</span><span class="gday">${dd}</span>`;
    cell.onclick=()=>selectCalDay(dateStr);
    grid.appendChild(cell);
  }
}
function toggleCalendar(){const c=document.getElementById('calContainer'),b=document.getElementById('calendarToggle');c.classList.toggle('hidden');b.textContent=c.classList.contains('hidden')?'פתח לוח חודשי':'סגור לוח חודשי'}
function selectCalDay(dateStr){const today=new Date();today.setHours(0,0,0,0);const target=new Date(dateStr+'T00:00:00');target.setHours(0,0,0,0);dateOffset=Math.round((target-today)/DAY_MS);fetchDay()}
function prevCalMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCalendar()}
function nextCalMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCalendar()}
function shiftDate(dir){dateOffset+=dir;fetchDay()}

// CONTROLS
function setMaster(m){masterMode=m;document.getElementById('tabGemara').classList.toggle('active',m==='gemara');document.getElementById('tabTanya').classList.toggle('active',m==='tanya');document.getElementById('gemaraCustomPicker').classList.toggle('hidden',m!=='gemara');document.getElementById('tanyaCustomPicker').classList.toggle('hidden',m!=='tanya');renderUI()}

function moveDaf(dir){const max=(TRACTATES.find(t=>t.en===customTractateEn)||{daf:64}).daf;if(dir>0){if(customAmud==='a')customAmud='b';else if(customDaf<max){customDaf++;customAmud='a'}}else{if(customAmud==='b')customAmud='a';else if(customDaf>2){customDaf--;customAmud='b'}}buildDafSelect();document.getElementById('customDaf').value=customDaf;document.getElementById('customAmud').value=customAmud}
function moveTanya(dir){const max=(TANYA_SECTIONS.find(s=>s.en===customSectionEn)||{max:53}).max;if(dir>0&&customChapter<max)customChapter++;else if(dir<0&&customChapter>1)customChapter--;document.getElementById('customChapter').value=customChapter}
function onSectionChange(){customSectionEn=document.getElementById('customSection').value;customChapter=1;buildChapterSelect()}
function toggleLearn(){
  const type=masterMode==='gemara'?'gemara':'tanya',was=isLearned(currentGregDate,type),now=!was;
  setLearned(currentGregDate,type,now);
  if(now)learnedDates[currentGregDate+':'+type]=true;else delete learnedDates[currentGregDate+':'+type];
  renderUI();renderCalendar();
}

function getCurrentRef(){
  if(masterMode==='gemara'){
    if(studyMode==='daily')return dailyDafRef?normalizeDafRef(dailyDafRef):null;
    const t=document.getElementById('customTractate').value||customTractateEn,d=parseInt(document.getElementById('customDaf').value,10)||customDaf,a=document.getElementById('customAmud').value||customAmud;

  const sec=document.getElementById('customSection').value||customSectionEn,ch=parseInt(document.getElementById('customChapter').value,10)||customChapter;
  return `tanya_${sec}_${ch}`;
}
function getCurrentTitle(){
  if(masterMode==='gemara'){
    if(studyMode==='daily')return dailyDafHe||dailyDafRef;
    const t=TRACTATES.find(x=>x.en===(document.getElementById('customTractate').value||customTractateEn)),d=parseInt(document.getElementById('customDaf').value,10)||customDaf,a=document.getElementById('customAmud').value||customAmud;
    return `${t?t.he:''} דף ${toGematria(d)} ע${a==='a'?'א':'ב'}`;
  }
  if(studyMode==='daily')return dailyTanyaHe||'תניא יומי';
  const sec=TANYA_SECTIONS.find(s=>s.en===(document.getElementById('customSection').value||customSectionEn)),ch=parseInt(document.getElementById('customChapter').value,10)||customChapter;
  return `תניא - ${sec?sec.he:''} פרק ${toGematria(ch)}`;
}
function enterBeitMidrash(){const ref=getCurrentRef();if(!ref){showError('לא נמצא דף יומי לתאריך הזה. נסה בחירה חופשית.');return}overlayRef=ref;overlayMaster=masterMode;document.getElementById('overlayTitle').textContent=getCurrentTitle();document.getElementById('dafNav').classList.toggle('hidden',masterMode!=='gemara');buildTabs();show('studyOverlay')}
function closeOverlay(){hide('studyOverlay')}

// FIXED GEMARA TABS + TEXT
const BASE_GEMARA_TABS=[
  {id:'scan',label:'צורת הדף',kind:'scan'},
  {id:'gemara_biur',label:'גמרא - ביאור',kind:'combo'},
  {id:'rashi',label:'רש״י',kind:'commentary',prefix:'Rashi_on_'},
  {id:'tosafot',label:'תוספות',kind:'commentary',prefix:'Tosafot_on_'}
];
const TABS_TANYA=[{id:'tanya_orig',label:'תניא'},{id:'tanya_explain',label:'ביאור'}];

async function buildTabs(){
  const container=document.getElementById('overlayTabs');
  const tabs=overlayMaster==='gemara'?BASE_GEMARA_TABS:TABS_TANYA;
  dynamicGemaraTabs=tabs;
  container.innerHTML='';
  tabs.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='tab'+(i===0?' active':'');
    btn.textContent=t.label;
    btn.id='tab_'+t.id;
    btn.onclick=()=>switchTab(t.id);
    container.appendChild(btn);
  });
  activeTab=tabs[0].id;
  loadTab(activeTab);
  document.getElementById('notesTa').value=getNote(overlayRef);
}
function switchTab(tabId){activeTab=tabId;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));const btn=document.getElementById('tab_'+tabId);if(btn)btn.classList.add('active');loadTab(tabId)}

async function fetchSefariaParagraphs(apiRef){
  const txt=await cachedText(`https://www.sefaria.org/api/texts/${encodeURIComponent(apiRef)}`);
  if(!txt.trim()||txt.trim().startsWith('<'))throw new Error('לא התקבל JSON');
  const data=JSON.parse(txt);
  const paragraphs=getHebTextArray(data);
  if(!paragraphs.length)throw new Error('אין תוכן');
  return paragraphs;
}
function renderParagraphs(title,paragraphs){
  return `<div class="gemara-text" dir="rtl"><div class="section-title">${escapeHTML(title)}</div>${paragraphs.map(p=>`<p>${p}</p>`).join('')}</div>`;
}
async function loadTab(tabId){
  const content=document.getElementById('tabContent');
  if(overlayMaster==='tanya')return loadTanyaTab(tabId,content);
  const tab=(dynamicGemaraTabs||BASE_GEMARA_TABS).find(t=>t.id===tabId)||BASE_GEMARA_TABS[0];
  if(tab.kind==='scan')return loadScan(content);
  content.innerHTML='<div class="loader"><div class="spin"></div><p>טוען...</p></div>';
  const baseRef=normalizeDafRef(overlayRef);
  try{
    if(tab.kind==='combo'){
      let html='';
      const gemara=await fetchSefariaParagraphs(baseRef);
      html+=renderParagraphs('גמרא',gemara);
      try{
        const biur=await fetchSefariaParagraphs(`Steinsaltz_on_${baseRef}`);
        html+=renderParagraphs('ביאור',biur);
      }catch(e){
        html+=`<div class="portal-card" style="min-height:auto"><div class="portal-box"><div class="portal-title">ביאור</div><div class="portal-desc">לא נמצא ביאור זמין לדף הזה בתוך ספריא.</div></div></div>`;
      }
      content.innerHTML=html;
      return;
    }
    const apiRef=`${tab.prefix}${baseRef}`;
    const paragraphs=await fetchSefariaParagraphs(apiRef);
    content.innerHTML=renderParagraphs(tab.label,paragraphs);
  }catch(e){
    const label=tab.label||'מקור';
    content.innerHTML=`<div class="portal-card"><div class="portal-box"><div class="portal-mark">${escapeHTML(label.slice(0,2))}</div><div class="portal-title">${escapeHTML(label)}</div><div class="portal-desc">לא נמצא תוכן זמין ללשונית הזאת בדף המבוקש.</div></div></div>`;
  }
}
function loadScan(content){
  const parsed=parseDafRef(overlayRef);
  if(!parsed){
    content.innerHTML=`<div class="portal-card"><div class="portal-box"><div class="portal-mark">דף</div><div class="portal-title">לא זוהה דף</div><div class="portal-desc">לא הצלחתי לזהות את הדף הנבחר.</div></div></div>`;
    return;
  }
  const t=TRACTATES.find(x=>x.en===parsed.tractateEn);
  const dafLabel=`${t?t.he:parsed.tractateEn} דף ${toGematria(parsed.daf)} ע${parsed.amud==='a'?'א':'ב'}`;
  const portalUrl=getDafYomiPortalUrl(parsed.tractateEn,parsed.daf,parsed.amud);
  content.innerHTML=`<div class="portal-card"><div class="portal-box"><div class="portal-mark">${toGematria(parsed.daf)}</div><div class="portal-title">צורת הדף</div><div class="portal-desc">${dafLabel}</div><a href="${portalUrl}" target="_blank" rel="noopener" class="portal-btn">פתח בפורטל הדף היומי</a></div></div>`;
}
async function loadTanyaTab(tabId,content){
  const isDaily=overlayRef==='tanya_daily';
  const ref=isDaily?null:tanyaRef(customSectionEn,customChapter);
  if(tabId==='tanya_orig' && ref){
    content.innerHTML='<div class="loader"><div class="spin"></div><p>טוען...</p></div>';
    try{const paragraphs=await fetchSefariaParagraphs(ref);content.innerHTML=renderParagraphs('תניא',paragraphs);return}catch(e){}
  }
  const url=isDaily?'https://he.chabad.org/dailystudy/tanya.htm':`https://www.sefaria.org/${encodeURIComponent(ref)}?lang=he`;
  const title=isDaily?'תניא יומי':'תניא לפי הפרק הנבחר';
  const desc=isDaily?'פתח את הלימוד היומי המלא באתר חב״ד.':'הקישור נפתח לפרק שבחרת, ולא לדף היומי הכללי.';
  content.innerHTML=`<div class="portal-card"><div class="portal-box"><div class="portal-mark">ת</div><div class="portal-title">${title}</div><div class="portal-desc">${desc}</div><a href="${url}" target="_blank" rel="noopener" class="portal-btn">פתח מקור</a></div></div>`;
}
function navigateDaf(dir){if(overlayMaster!=='gemara')return;overlayRef=getAdjacentRef(overlayRef,dir);const parsed=parseDafRef(overlayRef);if(parsed){const t=TRACTATES.find(x=>x.en===parsed.tractateEn);document.getElementById('overlayTitle').textContent=`${t?t.he:parsed.tractateEn} דף ${toGematria(parsed.daf)} ע${parsed.amud==='a'?'א':'ב'}`}buildTabs()}
function toggleNotes(){document.getElementById('notesArea').classList.toggle('hidden')}
function saveNote(){saveNoteVal(overlayRef,document.getElementById('notesTa').value)}

// HISTORY
function showHistory(){const container=document.getElementById('histContent'),entries=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('learned_')&&localStorage.getItem(k)==='1'){const parts=k.split('_');if(parts.length>=3)entries.push({type:parts[1],dateKey:parts.slice(2).join('_')})}}}catch(e){}entries.sort((a,b)=>b.dateKey.localeCompare(a.dateKey));if(!entries.length){container.innerHTML='<div style="text-align:center;color:var(--ink3);padding:40px;font-family:\'Noto Serif Hebrew\';font-size:18px;font-weight:900">עדיין לא סימנת לימודים</div>'}else{container.innerHTML=entries.map(e=>`<div class="hist-row"><strong>${e.dateKey}</strong><span class="${e.type==='gemara'?'hist-g':'hist-t'}">${e.type==='gemara'?'גמרא':'תניא'} ✓</span></div>`).join('')}show('histModal')}
function closeHistory(){hide('histModal')}
function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden')}
function showError(msg){const b=document.getElementById('errorBox');b.textContent=msg;b.classList.remove('hidden')}
</script>
