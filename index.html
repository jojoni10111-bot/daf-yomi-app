<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדף היומי שלי 📖</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d8b4fe; border-radius: 20px; }
        
        .sefaria-text b, .sefaria-text strong { color: #4c1d95; font-weight: 800; }
        .sefaria-text sup { color: #9ca3af; font-size: 0.75rem; }
    </style>

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png" />
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 flex items-center justify-center p-4">

    <div id="root" class="max-w-md w-full mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TRACTATES = [
            { he: 'ברכות', en: 'Berakhot' }, { he: 'שבת', en: 'Shabbat' }, { he: 'עירובין', en: 'Eruvin' },
            { he: 'פסחים', en: 'Pesachim' }, { he: 'שקלים', en: 'Shekalim' }, { he: 'יומא', en: 'Yoma' },
            { he: 'סוכה', en: 'Sukkah' }, { he: 'ביצה', en: 'Beitzah' }, { he: 'ראש השנה', en: 'Rosh Hashanah' },
            { he: 'תענית', en: 'Taanit' }, { he: 'מגילה', en: 'Megillah' }, { he: 'מועד קטן', en: 'Moed Katan' },
            { he: 'חגיגה', en: 'Chagigah' }, { he: 'יבמות', en: 'Yevamot' }, { he: 'כתובות', en: 'Ketubot' },
            { he: 'נדרים', en: 'Nedarim' }, { he: 'נזיר', en: 'Nazir' }, { he: 'סוטה', en: 'Sotah' },
            { he: 'גיטין', en: 'Gittin' }, { he: 'קידושין', en: 'Kiddushin' }, { he: 'בבא קמא', en: 'Bava Kamma' },
            { he: 'בבא מציעא', en: 'Bava Metzia' }, { he: 'בבא בתרא', en: 'Bava Batra' }, { he: 'סנהדרין', en: 'Sanhedrin' },
            { he: 'מכות', en: 'Makkot' }, { he: 'שבועות', en: 'Shevuot' }, { he: 'עבודה זרה', en: 'Avodah Zarah' },
            { he: 'הוריות', en: 'Horayot' }, { he: 'זבחים', en: 'Zevachim' }, { he: 'מנחות', en: 'Menachot' },
            { he: 'חולין', en: 'Chullin' }, { he: 'בכורות', en: 'Bekhorot' }, { he: 'ערכין', en: 'Arakhin' },
            { he: 'תמורה', en: 'Temurah' }, { he: 'כריתות', en: 'Keritot' }, { he: 'מעילה', en: 'Meilah' },
            { he: 'תמיד', en: 'Tamid' }, { he: 'מידות', en: 'Middot' }, { he: 'קינים', en: 'Kinnim' }, { he: 'נידה', en: 'Niddah' }
        ];

        function DafYomiApp() {
            const [studyMode, setStudyMode] = useState('daily');
            
            const [customTractate, setCustomTractate] = useState(TRACTATES[0].en);
            const [customDaf, setCustomDaf] = useState(2);
            const [customAmud, setCustomAmud] = useState('a');

            const [dateOffset, setDateOffset] = useState(0); 
            const [dafInfo, setDafInfo] = useState({ he: 'טוען מסכת ודף...', en: '', ref: '' });
            const [dateInfo, setDateInfo] = useState({ he: '', day: '', greg: '' });
            const [isLearned, setIsLearned] = useState(false);
            const [streak, setStreak] = useState(0);
            const [isLoading, setIsLoading] = useState(true);
            
            const [showText, setShowText] = useState(false);
            const [activeTab, setActiveTab] = useState('gemara');
            const [textContents, setTextContents] = useState({ gemara: [], rashi: [], tosafot: [], explanation: [] });
            const [isTextLoading, setIsTextLoading] = useState(false);
            const [currentActiveRef, setCurrentActiveRef] = useState(''); 

            const [learningHistory, setLearningHistory] = useState([]);
            const [showHistoryModal, setShowHistoryModal] = useState(false);

            // סטייט חדש לשמירת ההערות האישיות (ממופה לפי הרפרנס של הדף)
            const [personalNotes, setPersonalNotes] = useState({});

            useEffect(() => {
                const fetchDailyData = async () => {
                    setIsLoading(true);
                    try {
                        const targetDate = new Date();
                        targetDate.setDate(targetDate.getDate() + dateOffset);
                        
                        const year = targetDate.getFullYear();
                        const month = targetDate.getMonth() + 1;
                        const day = targetDate.getDate();

                        const sefariaResponse = await fetch(`https://www.sefaria.org/api/calendars?year=${year}&month=${month}&day=${day}`);
                        const sefariaData = await sefariaResponse.json();
                        
                        const dafItem = sefariaData.calendar_items.find(item => item.title.en === "Daf Yomi");
                        if (dafItem) {
                            setDafInfo({ 
                                he: dafItem.displayValue.he, 
                                en: dafItem.title.en,
                                ref: dafItem.url
                            });
                        }

                        const dateString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        const hebcalResponse = await fetch(`https://www.hebcal.com/converter?cfg=json&date=${dateString}&g2h=1&strict=1`);
                        const hebcalData = await hebcalResponse.json();
                        
                        const cleanHebrewDate = hebcalData.hebrew.replace(/[\u0591-\u05C7]/g, "");
                        const formattedGregDate = targetDate.toLocaleDateString('he-IL');
                        const daysHe = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
                        const dayNameStr = `יום ${daysHe[targetDate.getDay()]}`;

                        setDateInfo({ he: cleanHebrewDate, day: dayNameStr, greg: formattedGregDate });

                        const savedHistory = JSON.parse(localStorage.getItem('daf_history') || '[]');
                        setLearningHistory(savedHistory);

                        // טעינת ההערות האישיות מהזיכרון
                        const savedNotes = JSON.parse(localStorage.getItem('daf_personal_notes') || '{}');
                        setPersonalNotes(savedNotes);

                        const savedState = localStorage.getItem(`daf_learned_${formattedGregDate}`);
                        setIsLearned(savedState === 'true');

                        if (dateOffset === 0) {
                            const savedStreak = parseInt(localStorage.getItem('daf_streak') || '0', 10);
                            const lastLearnedDateStr = localStorage.getItem('daf_last_learned_date');
                            let currentStreak = savedStreak;

                            if (lastLearnedDateStr) {
                                const today = new Date();
                                const lastDate = new Date(lastLearnedDateStr);
                                const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
                                const lastDateMidnight = new Date(lastDate.getFullYear(), lastDate.getMonth(), lastDate.getDate());
                                const diffDays = Math.ceil(Math.abs(todayMidnight - lastDateMidnight) / (1000 * 60 * 60 * 24));
                                if (diffDays > 1 && savedState !== 'true') {
                                    currentStreak = 0;
                                    localStorage.setItem('daf_streak', '0');
                                }
                            }
                            setStreak(currentStreak);
                        } else {
                            setStreak(parseInt(localStorage.getItem('daf_streak') || '0', 10));
                        }

                        setIsLoading(false);
                    } catch (error) {
                        console.error('Error fetching APIs:', error);
                        setIsLoading(false);
                    }
                };
                fetchDailyData();
            }, [dateOffset]);

            useEffect(() => {
                setTextContents({ gemara: [], rashi: [], tosafot: [], explanation: [] });
            }, [customTractate, customDaf, customAmud, studyMode]);

            const parseSefariaText = (heData) => {
                if (!heData || heData.length === 0) return ['לא נמצא טקסט עבור מקור זה.'];
                if (Array.isArray(heData[0])) return heData.flat().filter(Boolean);
                return heData;
            };

            const fetchTextData = async (tabName, referenceToFetch) => {
                if (tabName === 'notes') return; // לא למשוך מספריא אם מדובר בלשונית ההערות
                if (textContents[tabName].length > 0 && currentActiveRef === referenceToFetch) return; 
                
                setIsTextLoading(true);
                try {
                    let url = '';
                    const safeRef = referenceToFetch.replace(/ /g, '_');
                    
                    switch (tabName) {
                        case 'gemara': url = `https://www.sefaria.org/api/texts/${safeRef}`; break;
                        case 'rashi': url = `https://www.sefaria.org/api/texts/Rashi_on_${safeRef}`; break;
                        case 'tosafot': url = `https://www.sefaria.org/api/texts/Tosafot_on_${safeRef}`; break;
                        case 'explanation': url = `https://www.sefaria.org/api/texts/Steinsaltz_on_${safeRef}`; break;
                    }

                    const response = await fetch(url);
                    const data = await response.json();
                    
                    setTextContents(prev => ({ ...prev, [tabName]: parseSefariaText(data.he) }));
                } catch (error) {
                    console.error('Error fetching text:', error);
                    setTextContents(prev => ({ ...prev, [tabName]: ['שגיאה בטעינת הטקסט.'] }));
                }
                setIsTextLoading(false);
            };

            const handleEnterBeitMidrash = () => {
                const referenceToFetch = studyMode === 'daily' 
                    ? dafInfo.ref 
                    : `${customTractate}.${customDaf}${customAmud}`;
                
                setCurrentActiveRef(referenceToFetch);
                setShowText(true);
                fetchTextData(activeTab, referenceToFetch);
            };

            const handleTabClick = (tabName) => {
                setActiveTab(tabName);
                fetchTextData(tabName, currentActiveRef);
            };

            // פונקציה לטיפול ושמירה אוטומטית של ההערות
            const handleNoteChange = (text) => {
                const updatedNotes = {
                    ...personalNotes,
                    [currentActiveRef]: text
                };
                setPersonalNotes(updatedNotes);
                localStorage.setItem('daf_personal_notes', JSON.stringify(updatedNotes));
            };

            const handleToggleLearn = () => {
                const newState = !isLearned;
                setIsLearned(newState);
                const todayStr = new Date().toISOString();
                
                let newStreak = streak;
                if (newState) {
                    newStreak += 1;
                    localStorage.setItem('daf_last_learned_date', todayStr);
                } else {
                    newStreak = Math.max(0, streak - 1);
                }
                setStreak(newStreak);
                localStorage.setItem('daf_streak', newStreak.toString());
                localStorage.setItem(`daf_learned_${dateInfo.greg}`, newState.toString());

                let currentHistory = [...learningHistory];
                if (newState) {
                    if (!currentHistory.some(item => item.gregDate === dateInfo.greg)) {
                        currentHistory.unshift({ gregDate: dateInfo.greg, heDate: dateInfo.he, dafName: dafInfo.he });
                    }
                } else {
                    currentHistory = currentHistory.filter(item => item.gregDate !== dateInfo.greg);
                }
                setLearningHistory(currentHistory);
                localStorage.setItem('daf_history', JSON.stringify(currentHistory));
            };

            const getCustomTractateHebrewName = () => {
                const found = TRACTATES.find(t => t.en === customTractate);
                return found ? found.he : '';
            };

            return (
                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border-2 border-purple-200 flex flex-col min-h-[85vh] relative w-full">
                    
                    <div className="bg-gradient-to-r from-purple-500 to-pink-500 p-6 text-white text-center relative shrink-0 rounded-b-[2rem] shadow-md z-10">
                        <div className="absolute top-4 left-4 bg-white/20 backdrop-blur-sm rounded-full px-3 py-1 flex items-center gap-1 shadow-sm">
                            <span className="text-xl">🔥</span>
                            <span className="font-bold">{streak}</span>
                        </div>
                        
                        <button 
                            onClick={() => setShowHistoryModal(true)}
                            className="absolute top-4 right-4 bg-white/20 hover:bg-white/30 backdrop-blur-sm rounded-full p-2 transition-colors shadow-sm"
                            title="יומן למידה"
                        >
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        </button>

                        <h1 className="text-3xl font-bold mt-2 shadow-sm">הדף היומי שלי 📖</h1>
                        
                        <div className="flex bg-white/20 p-1 rounded-xl mt-4 max-w-[250px] mx-auto shadow-inner">
                            <button 
                                onClick={() => setStudyMode('daily')}
                                className={`flex-1 py-1.5 px-3 rounded-lg text-sm font-bold transition-all ${studyMode === 'daily' ? 'bg-white text-purple-600 shadow-sm' : 'text-purple-100 hover:text-white'}`}
                            >
                                דף יומי
                            </button>
                            <button 
                                onClick={() => setStudyMode('custom')}
                                className={`flex-1 py-1.5 px-3 rounded-lg text-sm font-bold transition-all ${studyMode === 'custom' ? 'bg-white text-purple-600 shadow-sm' : 'text-purple-100 hover:text-white'}`}
                            >
                                לימוד אישי
                            </button>
                        </div>
                    </div>

                    <div className="p-6 text-center overflow-y-auto grow custom-scrollbar flex flex-col justify-center">
                        
                        {studyMode === 'daily' ? (
                            <div className="flex flex-col items-center animate-fade-in">
                                <div className="flex items-center justify-center gap-5 bg-gray-50 border border-gray-100 rounded-2xl px-4 py-2 shadow-inner min-w-[240px] mb-6">
                                    <button onClick={() => setDateOffset(prev => prev - 1)} className="p-2 hover:bg-purple-100 text-purple-500 rounded-full
